name: Android APK + AAB v0.19.5 bi-mass projection

on:
  push:
    branches:
      - 'agent/v0.19.5-bimass-zero-reference'
    paths:
      - 'scripts/apply-v0195-bimass-zero-reference.py'
      - '.github/workflows/android-build-v0195.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0195-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.19.5 bi-mass projection patch
        run: python3 scripts/apply-v0195-bimass-zero-reference.py

      - name: Regression and physics guards
        run: |
          grep -q 'versionCode = 41' app/build.gradle.kts
          grep -q 'versionName = "0.19.5"' app/build.gradle.kts
          grep -q 'thermal-zero-bimass-6' app/src/main/java/com/fabdata/app/PointSourceLayer.kt

          INERTIA=app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          ENGINE=app/src/main/java/com/fabdata/app/ThermalEngine.kt

          grep -q 'surfaceTauHours' "$INERTIA"
          grep -q 'deepTauHours' "$INERTIA"
          grep -q 'deepShare' "$INERTIA"
          grep -q 'propagateTwoMass' "$INERTIA"
          grep -q 'surfaceTarget = 0.82 \* forcing + 0.18 \* deep' "$INERTIA"
          grep -q 'val nextDeep = deep + alphaDeep \* (nextSurface - deep)' "$INERTIA"
          grep -q 'forcingSlopeBetween' "$INERTIA"
          grep -q 'temperature = outputMass\[index\]' "$INERTIA"

          grep -q 'val x = tout - mass' "$ENGINE"
          grep -q 'val y = a.temperature - mass' "$ENGINE"
          grep -q 'fitProjectionFactor' "$ENGINE"
          grep -q 'val target = mass + k \* (tout - mass)' "$ENGINE"
          grep -q 'if (coeff.size == 1 || coeff.size >= 6) return learned' "$ENGINE"

          # Le sélecteur/aides et le correctif ANR v0.19.3 restent intacts.
          git fetch origin tag v0.19.4 --force || true
          if git rev-parse v0.19.4 >/dev/null 2>&1; then
            for f in \
              app/src/main/java/com/fabdata/app/BackupLayer.kt \
              app/src/main/java/com/fabdata/app/DataLayer.kt \
              app/src/main/java/com/fabdata/app/MainActivity.kt \
              app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt \
              app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt; do
              if ! git diff --quiet v0.19.4 -- "$f"; then
                echo "ERROR: protected v0.19.4 file changed: $f"
                git diff v0.19.4 -- "$f"
                exit 1
              fi
            done
          fi

          python3 - <<'PY'
          import math

          # Projection centrée sur l'inertie : signe naturel, aucune division par x.
          def project(tm, tout, k):
              return tm + k * (tout - tm)
          assert abs(project(26.0, 30.0, 0.20) - 26.8) < 1e-12
          assert abs(project(26.0, 22.0, 0.20) - 25.2) < 1e-12
          assert project(26.0, 26.0, 0.20) == 26.0

          # Ajustement global à l'origine reste fini même avec des x=0.
          xs = [0.0, 0.0, 2.0, -2.0, 4.0, -4.0]
          ys = [0.1, -0.1, 0.4, -0.4, 0.8, -0.8]
          xx = sum(x*x for x in xs)
          xy = sum(x*y for x, y in zip(xs, ys))
          k = xy / xx
          assert math.isfinite(k) and abs(k - 0.20) < 1e-12

          # Bi-masse : un changement de forçage modifie immédiatement la pente
          # sans saut de valeur, puis se transmet lentement au noyau profond.
          surface_tau, deep_tau, share = 30.0, 336.0, 0.70
          surface = deep = mass = 26.0
          forcing = 30.0
          a_s = 1.0 - math.exp(-1.0 / surface_tau)
          a_d = 1.0 - math.exp(-1.0 / deep_tau)
          surface_target = 0.82 * forcing + 0.18 * deep
          next_surface = surface + a_s * (surface_target - surface)
          next_deep = deep + a_d * (next_surface - deep)
          next_mass = (1.0-share)*next_surface + share*next_deep
          assert 26.0 < next_mass < 26.2
          assert next_surface > surface
          assert next_deep > deep

          # Si le stimulus change de signe, la dérivée de surface change aussi de signe
          # alors que l'état reste continu.
          forcing2 = 22.0
          target2 = 0.82 * forcing2 + 0.18 * next_deep
          surface2 = next_surface + a_s * (target2 - next_surface)
          assert surface2 < next_surface

          print('v0.19.5 physics guards OK')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug first
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage v0.19.5 packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.19.5-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.19.5-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.19.5-signing-mode.txt
          sha256sum artifacts/FabData-v0.19.5-release.apk artifacts/FabData-v0.19.5-release.aab > artifacts/FabData-v0.19.5-sha256.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.19.5-release
          path: |
            artifacts/FabData-v0.19.5-release.apk
            artifacts/FabData-v0.19.5-release.aab
            artifacts/FabData-v0.19.5-signing-mode.txt
            artifacts/FabData-v0.19.5-sha256.txt
          if-no-files-found: error

      - name: Commit compiled source and packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
            artifacts/FabData-v0.19.5-release.apk \
            artifacts/FabData-v0.19.5-release.aab \
            artifacts/FabData-v0.19.5-signing-mode.txt \
            artifacts/FabData-v0.19.5-sha256.txt
          if git diff --cached --quiet; then
            echo "v0.19.5 source/packages unchanged"
          else
            git commit -m "Apply FabData v0.19.5 bi-mass inertia and zero-reference reconstruction"
            git push
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.19.5
        run: |
          NOTES='FabData v0.19.5 — test physique double. La température de sonde reconstruite utilise désormais l inertie thermique comme zéro : Tin = Tm + k [Tout(t-Δ)-Tm]. Seuls le facteur d atténuation k et le retard Δ sont appris sur les mesures réelles, par ajustement global robuste sans division point-à-point au passage de zéro. L inertie devient un modèle RC bi-masse : couche superficielle réactive + masse profonde lente, couplées en continu. Un stimulus extérieur change immédiatement la tangente de la surface sans saut de température, puis se transmet au noyau profond s il persiste. Les RAW, sélection/exclusion, aides et correctif ANR restent inchangés. MODEL_VERSION thermal-zero-bimass-6 force Rationaliser les courbes à identifier les anciennes reconstructions.'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.19.5" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.19.5-release.apk \
            artifacts/FabData-v0.19.5-release.aab \
            artifacts/FabData-v0.19.5-signing-mode.txt \
            artifacts/FabData-v0.19.5-sha256.txt \
            --clobber
