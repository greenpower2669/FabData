name: Apply sensor selector + inertial history fix

on:
  push:
    branches:
      - 'agent/fix-sensor-selector-inertia-history'
    paths:
      - '.github/workflows/apply-sensor-inertia-fix.yml'
      - 'tools/apply_sensor_inertia_fix.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply guarded source patch
        run: python3 tools/apply_sensor_inertia_fix.py

      - name: Regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui = Path('app/src/main/java/com/fabdata/app/ThermalUi.kt').read_text()
          engine = Path('app/src/main/java/com/fabdata/app/ThermalEngine.kt').read_text()
          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          inertia = Path('app/src/main/java/com/fabdata/app/ThermalInertiaHistory.kt').read_text()
          assert 'engine.status(reference' not in ui
          assert 'Prolonger le sol inertiel' in ui
          assert 'validation utilisateur requise' in ui
          assert 'Modèle non entraîné pour cette sonde' in ui
          assert 'COUNT(DISTINCT (p.timestamp / 86400000))' in engine
          assert 'validatedHistory + measuredProjection.surfacePoints' in main
          assert 'Aucune température intérieure reconstruite sur ce mois' in inertia
          assert 'calibrate(' not in inertia
          print('regression guards OK')
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalInertiaHistory.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Fix indoor sensor selector and manual inertial history"
            git push origin HEAD:${{ github.ref_name }}
          fi
