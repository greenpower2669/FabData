name: Build v0.21.9 multi-horizon forecast memory

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt'
      - 'app/src/main/java/com/fabdata/app/MainActivity.kt'
      - 'tools/patch_forecast_multihorizon_v0219.py'
      - '.github/workflows/build-v0219-multihorizon.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Apply multi-horizon forecast memory
        run: python3 tools/patch_forecast_multihorizon_v0219.py

      - name: Regression guard
        run: |
          git diff --check
          grep -n 'versionName = "0.21.9"' app/build.gradle.kts
          grep -n 'forecast_horizon_archive' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'FORECAST_ACTIVE_SENSOR_ID = -6902900110L' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'FORECAST_HORIZON_HOURS: IntRange = 1..24' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'Météo-France-like gliding curve' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'fixedLead = 24L' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'current/gliding forecast is a separate selectable curve' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'Prévision météo active' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévision météo H+24 fixe' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'forecastHorizonSensors' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'ForecastHorizonArchive(db).query' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FORECAST_ACTIVE_SENSOR_ID to predictionLod' app/src/main/java/com/fabdata/app/MainActivity.kt
          python3 - <<'PY'
          active = -6902900110
          existing = {
              -6902900102, -6902900103, -6902900104,
              -6902900105, -6902900106,
          }
          weather = {-6902900200 - h for h in range(1, 25)}
          fab = {-6902900300 - h for h in range(1, 25)}
          groups = [existing, {active}, weather, fab]
          union = set()
          for group in groups:
              if union & group:
                  raise SystemExit(f'synthetic sensor collision: {union & group}')
              union |= group
          print('Multi-horizon synthetic IDs unique:', len(union))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize release APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FabData-v0.21.9-release-multihorizon-h24.apk

      - name: Commit validated source
        run: |
          if git diff --quiet -- app/build.gradle.kts app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo "Multi-horizon source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts \
                    app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt \
                    app/src/main/java/com/fabdata/app/MainActivity.kt \
                    app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
            git commit -m "Add active and fixed H1-H24 forecast curves [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.21.9-release-multihorizon-h24
          path: app/build/outputs/apk/debug/FabData-v0.21.9-release-multihorizon-h24.apk
          if-no-files-found: error
