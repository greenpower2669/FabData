name: Compile FabData import v4 performance fix

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/import-v4-performance-progress'
    paths:
      - '.github/workflows/compile-import-v4-fix.yml'
      - 'app/src/main/java/com/fabdata/app/BackupLayer.kt'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/import-v4-performance-progress

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin
