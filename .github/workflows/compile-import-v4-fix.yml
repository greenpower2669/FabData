name: Build FabData import v4 performance fix test APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/import-v4-performance-progress'
    paths:
      - '.github/workflows/compile-import-v4-fix.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/fabdata/app/BackupLayer.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/import-v4-performance-progress

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build compact test APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage APK only
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/release/app-release.apk ci-artifacts/FabData-import-v4-fix-test.apk
          sha256sum ci-artifacts/FabData-import-v4-fix-test.apk > ci-artifacts/FabData-import-v4-fix-test-sha256.txt
          ls -lh ci-artifacts

      - name: Upload test APK only
        uses: actions/upload-artifact@v4
        with:
          name: FabData-import-v4-fix-test-release
          path: |
            ci-artifacts/FabData-import-v4-fix-test.apk
            ci-artifacts/FabData-import-v4-fix-test-sha256.txt
          if-no-files-found: error
