name: Build FabData v0.20.7 process performance

on:
  push:
    branches:
      - 'agent/v0.20.7-process-performance-overview'
    paths:
      - '.github/workflows/build-v0207-process-performance.yml'
      - 'tools/fix_v0207_process_perf.py'
      - 'app/src/main/java/com/fabdata/app/FabOperationRegistry.kt'
      - 'PERFORMANCE_AUDIT_V0207.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v0.20.7-process-performance-overview
          fetch-depth: 0

      - name: Apply v0.20.7 process/performance integration
        run: python3 tools/fix_v0207_process_perf.py

      - name: Diff and regression guards
        run: |
          git diff --check
          git diff --stat
          grep -q 'Activité FabData' app/src/main/java/com/fabdata/app/FabOperationRegistry.kt
          grep -q 'Historique intérieur déjà en cours' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'progression UI seulement' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'MIN ' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'MAX ' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'value >= 40.0' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'overviewReferenceRaw.size <= 1200' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q '1464 jours' PERFORMANCE_AUDIT_V0207.md
          grep -q 'single-flight' PERFORMANCE_AUDIT_V0207.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Commit integrated source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/fabdata/app/FabOperationRegistry.kt \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt \
            PERFORMANCE_AUDIT_V0207.md
          if git diff --cached --quiet; then
            echo "No source patch to commit"
          else
            git commit -m "Add process dashboard, cancellation guards and overview performance fixes"
            git push origin HEAD:agent/v0.20.7-process-performance-overview
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.20.7-process-performance-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.20.7-process-performance-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.20.7-process-performance-signing-mode.txt
          sha256sum artifacts/FabData-v0.20.7-process-performance-release.apk artifacts/FabData-v0.20.7-process-performance-release.aab > artifacts/FabData-v0.20.7-process-performance-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.20.7-process-performance
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release delete v0.20.7-process-performance --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.20.7-process-performance \
            --target "$TARGET_SHA" \
            --title "FabData v0.20.7 process performance" \
            --notes "Ajoute le bouton ↕ Activité en haut avec heure de démarrage, durée, phase, progression et Annuler. Empêche les doubles lancements d’historique intérieur, rend visibles les mises à jour météo/live/entraînements/sol inertiel, et supprime le rechargement global des courbes à chaque batch de 256 points. Décime la météo du bandeau global à ~1200 points. Ajoute au-dessus du bandeau d’exploration le MIN + date et MAX + date de la période affichée, avec code thermique jusqu’au violet au-dessus de 40 °C. Audit : la limite historique thermique est 48 mois, pas 24 ; la borne septembre 2024 de la capture correspond au preset 24 mois et ne prouve pas un manque de données." \
            artifacts/FabData-v0.20.7-process-performance-release.apk \
            artifacts/FabData-v0.20.7-process-performance-release.aab \
            artifacts/FabData-v0.20.7-process-performance-signing-mode.txt \
            artifacts/FabData-v0.20.7-process-performance-sha256.txt
