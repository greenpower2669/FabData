name: Build fixed-lead H24 terrain verification

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastReplayUi.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastPastArchive.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastCurve10mStore.kt'
      - 'app/src/main/java/com/fabdata/app/BackupV3Support.kt'
      - 'app/src/main/java/com/fabdata/app/MainActivity.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'tools/patch_forecast_fixed_lead_h24_v2.py'
      - 'tools/patch_forecast_cache_v3.py'
      - 'tools/patch_terrain_reference_ui.py'
      - '.github/workflows/build-forecast-memory-cadrans.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Switch past verification to Météo-France H24
        run: python3 tools/patch_forecast_fixed_lead_h24_v2.py

      - name: Invalidate prior mixed-horizon 10-minute cache
        run: python3 tools/patch_forecast_cache_v3.py

      - name: Apply terrain reference and UI audit fixes
        run: python3 tools/patch_terrain_reference_ui.py

      - name: Regression guard
        run: |
          git diff --check
          grep -n 'ForecastMemoryBootstrapProvider' app/src/main/AndroidManifest.xml
          grep -n 'forecast_snapshot_archive' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'Passé = H+24 fixe' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'terrainAt(referenceKey' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'FORECAST_RECONSTRUCTED_SENSOR_ID' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'FORECAST_FAB_SENSOR_ID' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'CURVE_STEP_10M_MS' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'past = fixed-lead Météo-France H+24 archive only' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'Scientific comparison: never fall back' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'forecast_curve_10m_archive' app/src/main/java/com/fabdata/app/ForecastCurve10mStore.kt
          grep -n 'fab-local-causal-h24-terrain-v3' app/src/main/java/com/fabdata/app/ForecastCurve10mStore.kt
          grep -n 'meteofrance-h24-terrain-cosine-10m' app/src/main/java/com/fabdata/app/ForecastCurve10mStore.kt
          grep -n 'previous-runs-api.open-meteo.com/v1/meteofrance' app/src/main/java/com/fabdata/app/ForecastPastArchive.kt
          grep -n 'temperature_2m_previous_day1' app/src/main/java/com/fabdata/app/ForecastPastArchive.kt
          grep -n 'open-meteo-previous-runs-h24-meteofrance' app/src/main/java/com/fabdata/app/ForecastPastArchive.kt
          ! grep -n 'historical-forecast-api.open-meteo.com' app/src/main/java/com/fabdata/app/ForecastPastArchive.kt
          grep -n 'versionName = "0.21.7"' app/build.gradle.kts
          grep -n 'mergeTerrainReference' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Référence terrain' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévision météo H+24' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévision Fab H+24' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FORECAST_RECONSTRUCTED_SENSOR_ID to predictionLod' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FORECAST_FAB_SENSOR_ID to predictionLod' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FORECAST_PAST_API_ARCHIVE' app/src/main/java/com/fabdata/app/BackupV3Support.kt
          grep -n 'FORECAST_CURVE_10M_ARCHIVE' app/src/main/java/com/fabdata/app/BackupV3Support.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize release APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FabData-v0.21.7-release-terrain-h24-ui.apk

      - name: Commit validated source
        run: |
          if git diff --quiet -- app/build.gradle.kts app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt app/src/main/java/com/fabdata/app/ForecastPastArchive.kt app/src/main/java/com/fabdata/app/ForecastCurve10mStore.kt app/src/main/java/com/fabdata/app/BackupV3Support.kt app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo "Terrain H24 source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts \
                    app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt \
                    app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt \
                    app/src/main/java/com/fabdata/app/ForecastPastArchive.kt \
                    app/src/main/java/com/fabdata/app/ForecastCurve10mStore.kt \
                    app/src/main/java/com/fabdata/app/BackupV3Support.kt \
                    app/src/main/java/com/fabdata/app/MainActivity.kt
            git commit -m "Unify terrain reference and H24 forecast UI [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.21.7-release-terrain-h24-ui
          path: app/build/outputs/apk/debug/FabData-v0.21.7-release-terrain-h24-ui.apk
          if-no-files-found: error
