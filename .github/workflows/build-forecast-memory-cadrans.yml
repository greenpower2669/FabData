name: Build forecast memory tangent dials

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-memory-cadrans'
    paths:
      - 'app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastReplayUi.kt'
      - 'app/src/main/java/com/fabdata/app/BackupV3Support.kt'
      - 'app/src/main/java/com/fabdata/app/MainActivity.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'tools/apply_forecast_dial_palette.py'
      - 'tools/apply_forecast_history_v2.py'
      - '.github/workflows/build-forecast-memory-cadrans.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-memory-cadrans
          fetch-depth: 0

      - name: Apply progressive dial palette
        run: python3 tools/apply_forecast_dial_palette.py

      - name: Apply prediction history v2
        run: python3 tools/apply_forecast_history_v2.py

      - name: Regression guard
        run: |
          git diff --check
          grep -n 'ForecastMemoryBootstrapProvider' app/src/main/AndroidManifest.xml
          grep -n 'forecast_snapshot_archive' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'source=.measured.' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n '24L \* HOUR_MS' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'errorSeverityColor' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'KEY_WIDTH_DP' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'drawResizeHandle' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'FORECAST_ARCHIVE' app/src/main/java/com/fabdata/app/BackupV3Support.kt
          grep -n 'ForecastReplayCard' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'MEASURED and RECONSTRUCTED values never enter it' app/src/main/java/com/fabdata/app/ForecastReplayUi.kt
          grep -n 'ForecastReplayKind.ESTIMATED' app/src/main/java/com/fabdata/app/ForecastReplayUi.kt
          ! grep -n 'bridgeCandidates' app/src/main/java/com/fabdata/app/ForecastReplayUi.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit validated forecast-history source
        run: |
          if git diff --quiet -- app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt app/src/main/java/com/fabdata/app/ForecastReplayUi.kt app/src/main/java/com/fabdata/app/BackupV3Support.kt app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo "Forecast history source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt \
                    app/src/main/java/com/fabdata/app/ForecastReplayUi.kt \
                    app/src/main/java/com/fabdata/app/BackupV3Support.kt \
                    app/src/main/java/com/fabdata/app/MainActivity.kt
            git commit -m "Add resizable dials and prediction-only history [skip ci]"
            git push origin HEAD:feature/forecast-memory-cadrans
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-forecast-memory-cadrans-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
