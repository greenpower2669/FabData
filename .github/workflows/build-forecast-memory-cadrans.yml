name: Build past forecast archive and 10-minute curves

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-past-archive-10m'
    paths:
      - 'app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastReplayUi.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastPastArchive.kt'
      - 'app/src/main/java/com/fabdata/app/BackupV3Support.kt'
      - 'app/src/main/java/com/fabdata/app/MainActivity.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'tools/apply_forecast_dial_palette.py'
      - 'tools/apply_forecast_history_v2.py'
      - 'tools/apply_latest_edge_cascade.py'
      - 'tools/patch_main_forecast_selector.py'
      - 'tools/patch_backup_forecast_local.py'
      - 'tools/patch_overlay_forecast_materialize.py'
      - 'tools/patch_forecast_past_archive_10m.py'
      - '.github/workflows/build-forecast-memory-cadrans.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-past-archive-10m
          fetch-depth: 0

      - name: Apply progressive dial palette
        run: python3 tools/apply_forecast_dial_palette.py

      - name: Apply prediction history v2
        run: python3 tools/apply_forecast_history_v2.py

      - name: Apply latest-edge cascade
        run: python3 tools/apply_latest_edge_cascade.py

      - name: Add selectable forecast curves
        run: |
          python3 tools/patch_main_forecast_selector.py
          python3 tools/patch_backup_forecast_local.py
          python3 tools/patch_overlay_forecast_materialize.py

      - name: Add cached historical forecast reconstruction
        run: python3 tools/patch_forecast_past_archive_10m.py

      - name: Regression guard
        run: |
          git diff --check
          grep -n 'ForecastMemoryBootstrapProvider' app/src/main/AndroidManifest.xml
          grep -n 'forecast_snapshot_archive' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'KEY_WIDTH_DP' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'cascade latest-edge au relâchement' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FORECAST_RECONSTRUCTED_SENSOR_ID' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'FORECAST_FAB_SENSOR_ID' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'CURVE_STEP_10M_MS' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt
          grep -n 'Prévision météo reconstruite' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévision Fab reconstruite' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'historical-forecast-api.open-meteo.com' app/src/main/java/com/fabdata/app/ForecastPastArchive.kt
          grep -n 'FORECAST_PAST_API_ARCHIVE' app/src/main/java/com/fabdata/app/BackupV3Support.kt
          grep -n 'ForecastPastArchiveBackfill' app/src/main/java/com/fabdata/app/MainActivity.kt
          ! grep -n 'source=.reconstructed.' app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize release APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FabData-v0.21.5-release-archives-previsions-10min.apk

      - name: Commit validated source
        run: |
          if git diff --quiet -- app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt app/src/main/java/com/fabdata/app/ForecastReplayUi.kt app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt app/src/main/java/com/fabdata/app/ForecastPastArchive.kt app/src/main/java/com/fabdata/app/BackupV3Support.kt app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo "Forecast archive source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt \
                    app/src/main/java/com/fabdata/app/ForecastReplayUi.kt \
                    app/src/main/java/com/fabdata/app/ForecastSelectableCurves.kt \
                    app/src/main/java/com/fabdata/app/ForecastPastArchive.kt \
                    app/src/main/java/com/fabdata/app/BackupV3Support.kt \
                    app/src/main/java/com/fabdata/app/MainActivity.kt
            git commit -m "Cache past forecast archive and 10-minute user backtest [skip ci]"
            git push origin HEAD:feature/forecast-past-archive-10m
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.21.5-release-archives-previsions-10min
          path: app/build/outputs/apk/debug/FabData-v0.21.5-release-archives-previsions-10min.apk
          if-no-files-found: error
