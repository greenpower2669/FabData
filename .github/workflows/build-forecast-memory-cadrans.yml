name: Build forecast memory tangent dials

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-memory-cadrans'
    paths:
      - 'app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/build-forecast-memory-cadrans.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-memory-cadrans
          fetch-depth: 0

      - name: Regression guard
        run: |
          git diff --check HEAD~3..HEAD || true
          grep -n 'ForecastMemoryBootstrapProvider' app/src/main/AndroidManifest.xml
          grep -n 'forecast_snapshot_archive' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'source=.measured.' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n '24L \* HOUR_MS' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-forecast-memory-cadrans-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
