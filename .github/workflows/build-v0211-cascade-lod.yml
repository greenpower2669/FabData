name: Build FabData v0.21.1 true cascade

on:
  push:
    branches:
      - 'agent/v0.21.1-cascade-lod'
    paths:
      - '.github/workflows/build-v0211-cascade-lod.yml'
      - 'tools/fix_v0211_true_cascade.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v0.21.1-cascade-lod
          fetch-depth: 0

      - name: Repair patch script typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/fix_v0211_true_cascade.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('s = g.read_text(encoding="utf-8")ns_old =', 's = g.read_text(encoding="utf-8")\nns_old =')
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile tools/fix_v0211_true_cascade.py

      - name: Apply true cascaded LOD
        run: python3 tools/fix_v0211_true_cascade.py

      - name: Regression diagnostics
        run: |
          git diff --check
          grep -n 'wideOverviewRange\|explorationOverviewRange' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'physicalLod(OVERVIEW_LOD_MONTH_MS, all)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'physicalLod(OVERVIEW_LOD_DAY_MS, navigatorScope)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'physicalLod(OVERVIEW_LOD_6H_MS, explorationScope)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Zoom large · LOD jour' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Sélection / exploration · LOD 6 h' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'versionName = "0.21.1"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Commit integrated source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/fabdata/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source patch to commit"
          else
            git commit -m "Make LOD navigation truly cascaded"
            git push origin HEAD:agent/v0.21.1-cascade-lod
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.21.1-cascade-lod-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.21.1-cascade-lod-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.21.1-cascade-lod-signing-mode.txt
          sha256sum artifacts/FabData-v0.21.1-cascade-lod-release.apk artifacts/FabData-v0.21.1-cascade-lod-release.aab > artifacts/FabData-v0.21.1-cascade-lod-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.21.1-cascade-lod
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release delete v0.21.1-cascade-lod --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.21.1-cascade-lod \
            --target "$TARGET_SHA" \
            --title "FabData v0.21.1 true LOD cascade" \
            --notes "Vraie cascade de navigation : seul le giga mensuel lit l'historique complet. Sa fenêtre pilote un zoom large journalier ; ce zoom large pilote une fenêtre de sélection en LOD 6 h ; le graphe détaillé reste le seul à lire la petite fenêtre RAW. Les fenêtres ont désormais des centres indépendants : déplacer le giga déplace la grande zone, déplacer le zoom large déplace seulement la sélection. Les requêtes météo, sondes et sol inertiel des niveaux jour/6 h sont bornées directement en SQLite à leur fenêtre respective. Déplacement au doigt débouncé 140 ms pour éviter de relancer SQLite à chaque pixel. Courbes de bandeau personnalisables, effets v0.20.9, sauvegarde V4 et historique météo continu conservés." \
            artifacts/FabData-v0.21.1-cascade-lod-release.apk \
            artifacts/FabData-v0.21.1-cascade-lod-release.aab \
            artifacts/FabData-v0.21.1-cascade-lod-signing-mode.txt \
            artifacts/FabData-v0.21.1-cascade-lod-sha256.txt
