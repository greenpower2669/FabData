name: Android APK + AAB v0.19.6 final2

on:
  push:
    branches:
      - 'agent/v0.19.6-ground-visible-hidden-mass'
    paths:
      - '.github/workflows/android-build-v0196-ground-visible-final2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0196-final2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.19.6 correction
        run: python3 scripts/apply-v0196-ground-visible-hidden-mass.py

      - name: Validate correction and preserve physics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path('app/build.gradle.kts').read_text()
          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          engine = Path('app/src/main/java/com/fabdata/app/ThermalEngine.kt').read_text()
          inertia = Path('app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt').read_text()
          ui = Path('app/src/main/java/com/fabdata/app/ThermalExperimentUi.kt').read_text()
          point = Path('app/src/main/java/com/fabdata/app/PointSourceLayer.kt').read_text()

          checks = [
              ('versionCode = 42', build),
              ('versionName = "0.19.6"', build),
              ('val target = mass + k * (tout - mass)', engine),
              ('private fun fitProjectionFactor', engine),
              ('thermal-zero-bimass-6', point),
              ('private fun propagateTwoMass', inertia),
              ('val surfaceTarget = 0.82 * forcing + 0.18 * deep', inertia),
              ('val nextDeep = deep + alphaDeep * (nextSurface - deep)', inertia),
              ('showTemp[THERMAL_INERTIA_SENSOR_ID] = false', main),
              ('surface / le sol équivalent', ui),
              ('État thermique bâtiment (caché)', ui),
              ('Sélectionner une période', main),
              ('? Aide', main),
              ('! Astuce du jour', main),
          ]
          for needle, haystack in checks:
              assert needle in haystack, needle

          for forbidden in (
              'physicalChartSensors + weatherOfficialSensor + lyonReconstructedSensor + inertiaSensor',
              'THERMAL_INERTIA_SENSOR_ID to inertiaVisible',
              'THERMAL_INERTIA_SENSOR_ID to inertiaOverview',
          ):
              assert forbidden not in main, forbidden

          def ground(tb, tout, k):
              return tb + k * (tout - tb)
          assert ground(28.0, 28.0, 0.2) == 28.0
          assert 28.0 < ground(28.0, 34.0, 0.2) < 34.0
          assert 22.0 < ground(28.0, 22.0, 0.2) < 28.0
          print('v0.19.6 guards OK')
          PY

          git fetch origin tag v0.19.5 --force || true
          for f in \
            app/src/main/java/com/fabdata/app/BackupLayer.kt \
            app/src/main/java/com/fabdata/app/DataLayer.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt; do
            git diff --quiet v0.19.5 -- "$f" || { echo "ERROR protected file changed: $f"; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.19.6-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.19.6-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.19.6-signing-mode.txt
          sha256sum artifacts/FabData-v0.19.6-release.apk artifacts/FabData-v0.19.6-release.aab > artifacts/FabData-v0.19.6-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.19.6-release
          path: |
            artifacts/FabData-v0.19.6-release.apk
            artifacts/FabData-v0.19.6-release.aab
            artifacts/FabData-v0.19.6-signing-mode.txt
            artifacts/FabData-v0.19.6-sha256.txt
          if-no-files-found: error

      - name: Commit correction and packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalExperimentUi.kt \
            app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt \
            artifacts/FabData-v0.19.6-release.apk \
            artifacts/FabData-v0.19.6-release.aab \
            artifacts/FabData-v0.19.6-signing-mode.txt \
            artifacts/FabData-v0.19.6-sha256.txt
          git commit -m "Release FabData v0.19.6 ground surface output"
          git push

      - name: Publish v0.19.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.19.6 \
            --target "$(git rev-parse HEAD)" \
            --title "FabData v0.19.6" \
            --notes 'La reconstruction visible représente désormais la surface / le sol équivalent. La masse thermique bi-masse du bâtiment reste cachée dans le moteur et n est plus superposée au graphe principal. Les équations v0.19.5, k, Δ, RC bi-masse, RAW, sélection/exclusion et aides restent inchangés. La masse profonde sera réservée à une future vue Topo.' \
            artifacts/FabData-v0.19.6-release.apk \
            artifacts/FabData-v0.19.6-release.aab \
            artifacts/FabData-v0.19.6-signing-mode.txt \
            artifacts/FabData-v0.19.6-sha256.txt
