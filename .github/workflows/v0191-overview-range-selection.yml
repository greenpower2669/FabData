name: FabData v0.19.1 overview range selection

on:
  push:
    branches:
      - 'agent/v0.19-inertia-tangent-context-mask-help'
    paths:
      - 'scripts/apply-v0191-overview-range-selection.py'
      - '.github/workflows/v0191-overview-range-selection.yml'
      - 'app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0191-range-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.19.1 range selection patch
        run: python3 scripts/apply-v0191-overview-range-selection.py

      - name: Regression guards
        run: |
          # Protected layers: this UI/mask evolution must not touch RAW/import/RC/reference engines.
          git diff --quiet -- app/src/main/java/com/fabdata/app/BackupLayer.kt
          git diff --quiet -- app/src/main/java/com/fabdata/app/DataLayer.kt
          git diff --quiet -- app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          git diff --quiet -- app/src/main/java/com/fabdata/app/ThermalEngine.kt
          git diff --quiet -- app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt

          grep -q 'versionCode = 37' app/build.gradle.kts
          grep -q 'versionName = "0.19.1"' app/build.gradle.kts
          grep -q 'var customViewSpanMs' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Sélectionner une période' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q "Utiliser cette zone pour entraîner l'inertie" app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q "Exclure cette zone du modèle d'inertie" app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Utiliser cette zone comme nouveau zoom' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'customViewSpanMs = null' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'preset = TimePreset.TWO_DAYS' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'fun includeRange' app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt
          grep -q 'fun addMerged' app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt
          grep -q 'source = PointSource.RECONSTRUCTED' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Commit compiled v0.19.1 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/fabdata/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "v0.19.1 range UI already applied"
          else
            git commit -m "Apply FabData v0.19.1 overview range selection"
            git push
          fi
