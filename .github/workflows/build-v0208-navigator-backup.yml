name: Build FabData v0.20.8 navigator backup

on:
  push:
    branches:
      - 'agent/v0.20.8-navigator-backup-integrity'
    paths:
      - '.github/workflows/build-v0208-navigator-backup.yml'
      - 'tools/fix_v0208_navigator_backup.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v0.20.8-navigator-backup-integrity
          fetch-depth: 0

      - name: Apply v0.20.8 integration
        run: python3 tools/fix_v0208_navigator_backup.py

      - name: Diff and regression guards
        run: |
          git diff --check
          git diff --stat
          grep -q 'Navigation globale · glisse la fenêtre' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'previewSensorPoints = remember' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'key = "backup-export"' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'const val FORMAT_VERSION = "4"' app/src/main/java/com/fabdata/app/BackupLayer.kt
          grep -q 'BACKUP_END' app/src/main/java/com/fabdata/app/BackupLayer.kt
          grep -q 'File.createTempFile' app/src/main/java/com/fabdata/app/BackupLayer.kt
          grep -q 'setOf("1", "2", "3", FORMAT_VERSION)' app/src/main/java/com/fabdata/app/BackupLayer.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Commit integrated source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/BackupLayer.kt
          if git diff --cached --quiet; then
            echo "No source patch to commit"
          else
            git commit -m "Add global navigator cursor and atomic backup integrity"
            git push origin HEAD:agent/v0.20.8-navigator-backup-integrity
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.20.8-navigator-backup-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.20.8-navigator-backup-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.20.8-navigator-backup-signing-mode.txt
          sha256sum artifacts/FabData-v0.20.8-navigator-backup-release.apk artifacts/FabData-v0.20.8-navigator-backup-release.aab > artifacts/FabData-v0.20.8-navigator-backup-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.20.8-navigator-backup
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release delete v0.20.8-navigator-backup --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.20.8-navigator-backup \
            --target "$TARGET_SHA" \
            --title "FabData v0.20.8 navigator backup" \
            --notes "Ajoute un vrai bandeau d’exploration du bandeau d’exploration : tout l’historique reste en miniature et une fenêtre glissable au doigt/souris pilote le bandeau principal. Les MIN/MAX et dates restent calculés uniquement sur la fenêtre explorée. Le bandeau principal réutilise des points déjà filtrés pour réduire les calculs d’affichage. Sécurise aussi la sauvegarde : v4 générée d’abord en cache, footer BACKUP_END avec compteurs, copie vers le document seulement après validation, import v4 refusé si tronqué, compatibilité v1/v2/v3 conservée, sauvegarde visible dans ↕ Activité." \
            artifacts/FabData-v0.20.8-navigator-backup-release.apk \
            artifacts/FabData-v0.20.8-navigator-backup-release.aab \
            artifacts/FabData-v0.20.8-navigator-backup-signing-mode.txt \
            artifacts/FabData-v0.20.8-navigator-backup-sha256.txt
