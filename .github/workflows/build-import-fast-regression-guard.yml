name: Build guarded import fast test APK

on:
  push:
    branches:
      - fix/v0236-import-fast-regression-guard
    paths:
      - 'app/**'
      - 'tools/patch_import_fast_regression_guard.py'
      - 'vigilance.md'
      - '.github/workflows/build-import-fast-regression-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0236-import-fast-regression-guard
          fetch-depth: 0

      - name: Apply guarded import patch
        run: python tools/patch_import_fast_regression_guard.py

      - name: Commit patched source when needed
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/BackupLayer.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/fabdata/app/BackupLayer.kt
            git commit -m "Optimize backup restore without dial regressions"
            git push origin HEAD:fix/v0236-import-fast-regression-guard
          else
            echo "BackupLayer already patched"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Make test package install beside normal FabData
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          needle = '''        release {\n            isMinifyEnabled = true\n'''
          replacement = '''        release {\n            applicationIdSuffix = ".importfasttest"\n            versionNameSuffix = "-importfast-test"\n            isMinifyEnabled = true\n'''
          if needle not in text:
              raise SystemExit('release block not found')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Build release test APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage APK only
        shell: bash
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/release/app-release.apk ci-artifacts/FabData-v0.23.6-importfast-test.apk
          sha256sum ci-artifacts/FabData-v0.23.6-importfast-test.apk > ci-artifacts/FabData-v0.23.6-importfast-test-sha256.txt
          ls -lh ci-artifacts/

      - name: Upload guarded test APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.6-importfast-test
          path: |
            ci-artifacts/FabData-v0.23.6-importfast-test.apk
            ci-artifacts/FabData-v0.23.6-importfast-test-sha256.txt
          if-no-files-found: error
          retention-days: 30
