name: Build FabData v0.20 exterior walls APK

on:
  push:
    branches:
      - 'agent/v0.20-exterior-walls-foundation'
    paths:
      - '.github/workflows/build-v020-exterior-walls.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v0.20-exterior-walls-foundation
          fetch-depth: 0

      - name: Integrate exterior sensor roles and wall UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  print(label, 'already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found')
              p.write_text(text.replace(old, new, 1))
              print(label, 'OK')

          # Database v5: additive thermal roles/walls/model tables + trigger for future CSV sensors.
          data = Path('app/src/main/java/com/fabdata/app/DataLayer.kt')
          t = data.read_text()
          t = t.replace('SQLiteOpenHelper(context, "fabdata.db", null, 4)', 'SQLiteOpenHelper(context, "fabdata.db", null, 5)')
          create_anchor = '        WeatherReferenceStore.ensure(db)\n'
          create_add = '        WeatherReferenceStore.ensure(db)\n        ThermalWallConfigStore.ensure(db)\n        ThermalWallSolarModelStore.ensure(db)\n'
          if create_add not in t:
              if create_anchor not in t:
                  raise SystemExit('DataLayer onCreate anchor missing')
              t = t.replace(create_anchor, create_add, 1)
          upgrade_anchor = '''        if (oldVersion < 4) {
            // v0.10 : métadonnées additives uniquement. Les anciennes lignes restent measured par défaut.
            PointSourceStore.ensure(db)
            WeatherReferenceStore.ensure(db)
        }
'''
          upgrade_add = upgrade_anchor + '''        if (oldVersion < 5) {
            // v0.20 : rôles de sondes + pans de mur + modèles solaires, migration additive uniquement.
            ThermalWallConfigStore.ensure(db)
            ThermalWallSolarModelStore.ensure(db)
        }
'''
          if 'if (oldVersion < 5)' not in t:
              if upgrade_anchor not in t:
                  raise SystemExit('DataLayer onUpgrade anchor missing')
              t = t.replace(upgrade_anchor, upgrade_add, 1)
          legacy_filter = "WHERE s.stable_key NOT LIKE 'meteo-%'\n              AND s.stable_key NOT LIKE 'http-get-%'"
          role_filter = "WHERE s.id IN (SELECT sensor_id FROM sensor_thermal_config WHERE role='INDOOR')"
          count = t.count(legacy_filter)
          if count:
              t = t.replace(legacy_filter, role_filter)
              print('DataLayer role-aware physical filters:', count)
          data.write_text(t)

          # ThermalEngine: exactly one selected INDOOR sensor remains the model target;
          # outdoor/undefined sensors can never enter the indoor candidates or building median.
          engine = Path('app/src/main/java/com/fabdata/app/ThermalEngine.kt')
          t = engine.read_text()
          anchor = '    private val coherenceStore = ThermalCoherenceStore(db)\n'
          add = anchor + '    private val wallConfigStore = ThermalWallConfigStore(db)\n'
          if 'private val wallConfigStore = ThermalWallConfigStore(db)' not in t:
              if anchor not in t: raise SystemExit('ThermalEngine field anchor missing')
              t = t.replace(anchor, add, 1)
          old = '''    private fun physicalSensors(): List<Sensor> = db.sensors().filter { s ->
        !s.stableKey.startsWith("meteo-") && !s.stableKey.startsWith("http-get-") && s.id >= 0L
    }
'''
          new = '''    private fun physicalSensors(): List<Sensor> = wallConfigStore.indoorSensors()
'''
          if old in t:
              t = t.replace(old, new, 1)
          elif new not in t:
              raise SystemExit('ThermalEngine physicalSensors anchor missing')
          engine.write_text(t)

          # Hidden/observable inertial mass must use only INDOOR sensors as well.
          inertia = Path('app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt')
          t = inertia.read_text()
          anchor = '    private var cachedKey: String? = null\n'
          add = '    private val wallConfigStore = ThermalWallConfigStore(db)\n' + anchor
          if 'private val wallConfigStore = ThermalWallConfigStore(db)' not in t:
              if anchor not in t: raise SystemExit('Inertia field anchor missing')
              t = t.replace(anchor, add, 1)
          old = '''        val sensors = db.sensors().filter { s ->
            (sensorId == null || s.id == sensorId) &&
                s.id >= 0L && !s.stableKey.startsWith("meteo-") && !s.stableKey.startsWith("http-get-")
        }
'''
          new = '''        val sensors = wallConfigStore.indoorSensors().filter { s ->
            sensorId == null || s.id == sensorId
        }
'''
          if old in t:
              t = t.replace(old, new, 1)
          elif new not in t:
              raise SystemExit('Inertia sensor selector anchor missing')
          inertia.write_text(t)

          # Rationalisation must also stay on indoor calculated curves.
          coherence = Path('app/src/main/java/com/fabdata/app/ThermalCoherence.kt')
          t = coherence.read_text()
          old = """            JOIN sensors s ON s.id=ps.sensor_id
            WHERE ps.source IN ('reconstructed','forecast')
              AND ps.sensor_id>=0
              AND s.stable_key NOT LIKE 'meteo-%'
              AND s.stable_key NOT LIKE 'http-get-%'
"""
          new = """            JOIN sensors s ON s.id=ps.sensor_id
            JOIN sensor_thermal_config tc ON tc.sensor_id=s.id
            WHERE ps.source IN ('reconstructed','forecast')
              AND ps.sensor_id>=0
              AND tc.role='INDOOR'
"""
          if old in t:
              t = t.replace(old, new, 1)
          elif new not in t:
              raise SystemExit('ThermalCoherence selector anchor missing')
          coherence.write_text(t)

          # Place the new menu immediately after the existing building customisation card.
          ui = Path('app/src/main/java/com/fabdata/app/ThermalUi.kt')
          t = ui.read_text()
          forecast_anchor = '''            Card(shape = RoundedCornerShape(14.dp)) {
                Column(Modifier.fillMaxWidth().padding(12.dp), verticalArrangement = Arrangement.spacedBy(7.dp)) {
                    Text("Prévision adaptative", fontWeight = FontWeight.SemiBold)
'''
          wall_card = '''            ThermalWallSettingsCard(
                db = db,
                reference = reference,
                enabled = !busy,
                onChanged = {
                    trainedModelStore.markDirty("Sondes ou pans extérieurs modifiés")
                    trainedModel = null
                    status = engine.statusFromTrainedModel(reference, selectedSensorId, null)
                    info = "Configuration thermique modifiée · réentraînement intérieur manuel requis"
                }
            )

''' + forecast_anchor
          if 'ThermalWallSettingsCard(' not in t:
              if forecast_anchor not in t: raise SystemExit('ThermalUi insertion anchor missing')
              t = t.replace(forecast_anchor, wall_card, 1)
          ui.write_text(t)

          # Small missing extension import in the new standalone Compose UI.
          wall_ui = Path('app/src/main/java/com/fabdata/app/ThermalWallSettingsUi.kt')
          t = wall_ui.read_text()
          if 'import androidx.compose.foundation.layout.weight\n' not in t:
              t = t.replace('import androidx.compose.foundation.layout.size\n', 'import androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.weight\n')
          wall_ui.write_text(t)

          # Sanity guards: new code must not silently replace the old mass model.
          assert 'wallConfigStore.indoorSensors()' in engine.read_text()
          assert 'ThermalWallSettingsCard(' in ui.read_text()
          assert 'THERMAL_INERTIA_SENSOR_ID' in Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          assert 'MEASURED' in Path('app/src/main/java/com/fabdata/app/PointSourceLayer.kt').read_text()
          print('v0.20 integration patches OK')
          PY

      - name: Diff guard
        run: |
          git diff --check
          git diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Commit integrated source
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fabdata/app
          if git diff --cached --quiet; then
            echo "No source patch to commit"
          else
            git commit -m "Integrate v0.20 exterior sensor roles and wall solar UI"
            git push origin HEAD:agent/v0.20-exterior-walls-foundation
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.20-exterior-walls1-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.20-exterior-walls1-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.20-exterior-walls1-signing-mode.txt
          sha256sum artifacts/FabData-v0.20-exterior-walls1-release.apk artifacts/FabData-v0.20-exterior-walls1-release.aab > artifacts/FabData-v0.20-exterior-walls1-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.20-exterior-walls1
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release delete v0.20-exterior-walls1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.20-exterior-walls1 \
            --target "$TARGET_SHA" \
            --title "FabData v0.20 exterior walls test" \
            --notes "Premier APK v0.20 : rôles Intérieure/Extérieure/Non définie, jusqu'à 4 pans avec surface/orientation/exposition, boussole, association sonde-pan, entraînement solaire saisonnier et reconstruction historique opt-in. Les mesures MEASURED restent toujours prioritaires et le moteur intérieur v0.19.8 reste le fallback." \
            artifacts/FabData-v0.20-exterior-walls1-release.apk \
            artifacts/FabData-v0.20-exterior-walls1-release.aab \
            artifacts/FabData-v0.20-exterior-walls1-signing-mode.txt \
            artifacts/FabData-v0.20-exterior-walls1-sha256.txt
