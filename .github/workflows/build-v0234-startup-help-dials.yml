name: Build v0.23.7 canonical scheduler

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'tools/patch_v0237_slot_store.py'
      - 'tools/patch_v0237_horizon_windows.py'
      - 'tools/patch_v0237_ui_queue.py'
      - '.github/workflows/build-v0234-startup-help-dials.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Validate patches
        run: |
          python3 -m py_compile tools/patch_v0237_slot_store.py
          python3 -m py_compile tools/patch_v0237_horizon_windows.py
          python3 -m py_compile tools/patch_v0237_ui_queue.py

      - name: Apply v0.23.7 patches
        run: |
          python3 tools/patch_v0237_slot_store.py
          python3 tools/patch_v0237_horizon_windows.py
          python3 tools/patch_v0237_ui_queue.py

      - name: Regression guards
        run: |
          git diff --check
          grep -n 'versionName = "0.23.7"' app/build.gradle.kts
          grep -n 'forecast_capture_attempt' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'fun tryClaimCaptureSlot' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'fun captureSlotClosed' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'fixed-window-10m-v2' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'H1 = +10..+60 min' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'latestSnapshotWeatherByLead' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'jet unique H+1 → H+48' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -n 'recalcul Fab uniquement' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          ! grep -n 'updateLive(force = true)' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -n 'Déclenché par :' app/src/main/java/com/fabdata/app/FabOperationRegistry.kt
          grep -n 'reloadPendingTrigger' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'interaction utilisateur plus récente' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'if (selectedTimestamp == null)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'tryClaimCaptureSlot' app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FabData-v0.23.7-release-canonical-scheduler.apk

      - name: Commit validated generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt \
            app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt \
            app/src/main/java/com/fabdata/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "v0.23.7 generated source already committed"
          else
            git commit -m "Finalize canonical 10-minute scheduler and traced UI queue [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.7-release-canonical-scheduler
          path: app/build/outputs/apk/debug/FabData-v0.23.7-release-canonical-scheduler.apk
          if-no-files-found: error
