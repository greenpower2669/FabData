name: Build v0.23.4 startup help dials

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'tools/patch_v0234_startup_help_dials.py'
      - '.github/workflows/build-v0234-startup-help-dials.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Validate patch
        run: python3 -m py_compile tools/patch_v0234_startup_help_dials.py

      - name: Apply v0.23.4 patch
        run: python3 tools/patch_v0234_startup_help_dials.py

      - name: Regression guards
        run: |
          git diff --check
          grep -n 'versionName = "0.23.4"' app/build.gradle.kts
          grep -n 'versionCode = 61' app/build.gradle.kts
          grep -n 'getInt(DIAL_WEATHER_HORIZON_KEY, 1)' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'getInt(DIAL_ADAPTIVE_HORIZON_KEY, 1)' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'if (label == "FUTUR") null else terrainAt' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
          grep -n 'delay(350L)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FabOperationRegistry.discard(reloadOperation)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'fun discard(id: Long?)' app/src/main/java/com/fabdata/app/FabOperationRegistry.kt
          grep -n 'Aide · cadrans flottants' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Politique de confidentialité · FabData v0.23.4' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'les mesures intérieures ne leur sont pas envoyées' app/src/main/java/com/fabdata/app/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FabData-v0.23.4-release-startup-help-dials.apk

      - name: Commit validated source
        run: |
          if git diff --quiet; then
            echo "v0.23.4 source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts \
                    app/src/main/java/com/fabdata/app/MainActivity.kt \
                    app/src/main/java/com/fabdata/app/FabOperationRegistry.kt \
                    app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
            git commit -m "Coalesce startup refreshes and clarify dial monitoring [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.4-release-startup-help-dials
          path: app/build/outputs/apk/debug/FabData-v0.23.4-release-startup-help-dials.apk
          if-no-files-found: error
