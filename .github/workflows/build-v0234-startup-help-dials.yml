name: Build v0.23.5 priority reload buffer

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'tools/patch_v0235_priority_reload_buffer.py'
      - '.github/workflows/build-v0234-startup-help-dials.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Validate patch
        run: python3 -m py_compile tools/patch_v0235_priority_reload_buffer.py

      - name: Apply v0.23.5 patch
        run: python3 tools/patch_v0235_priority_reload_buffer.py

      - name: Regression guards
        run: |
          git diff --check
          grep -n 'versionName = "0.23.5"' app/build.gradle.kts
          grep -n 'enum class UiReloadPriority' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'snapshotFlow { reloadRequestGeneration }' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n '\.conflate()' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'queueUiReload(UiReloadPriority.CRITICAL)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'queueUiReload(UiReloadPriority.DATA)' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'queueUiReload(UiReloadPriority.NAVIGATION)' app/src/main/java/com/fabdata/app/MainActivity.kt
          if grep -n 'LaunchedEffect(reloadToken, preset, windowCenterTimestamp' app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo 'Old cancellation-prone keyed reload effect still present' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FabData-v0.23.5-release-priority-buffer.apk

      - name: Commit validated source
        run: |
          if git diff --quiet; then
            echo "v0.23.5 source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts app/src/main/java/com/fabdata/app/MainActivity.kt
            git commit -m "Serialize UI refreshes with priority buffer [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.5-release-priority-buffer
          path: app/build/outputs/apk/debug/FabData-v0.23.5-release-priority-buffer.apk
          if-no-files-found: error
