name: Build v0.23.6 import priority arbitration

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'tools/patch_v0236_import_priority.py'
      - '.github/workflows/build-v0234-startup-help-dials.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Validate patch
        run: python3 -m py_compile tools/patch_v0236_import_priority.py

      - name: Apply v0.23.6 patch
        run: python3 tools/patch_v0236_import_priority.py

      - name: Regression guards
        run: |
          git diff --check
          grep -n 'versionName = "0.23.6"' app/build.gradle.kts
          grep -n 'object FabDataWorkArbiter' app/src/main/java/com/fabdata/app/FabOperationRegistry.kt
          grep -n 'fun requestYieldForImport' app/src/main/java/com/fabdata/app/FabOperationRegistry.kt
          grep -n 'title = "Importation prioritaire"' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FabDataWorkArbiter.withCriticalImport' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FabDataWorkArbiter.criticalImportPending' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'FabDataWorkArbiter.withDataProducer producer@' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -n 'Import prioritaire en cours · actualisation météo reportée' app/src/main/java/com/fabdata/app/ThermalUi.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FabData-v0.23.6-release-import-priority.apk

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/FabOperationRegistry.kt \
            app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt
          if git diff --cached --quiet; then
            echo "v0.23.6 source already committed"
          else
            git commit -m "Prioritize imports over weather and display work [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.6-release-import-priority
          path: app/build/outputs/apk/debug/FabData-v0.23.6-release-import-priority.apk
          if-no-files-found: error
