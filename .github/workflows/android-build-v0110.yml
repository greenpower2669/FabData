name: Android APK + AAB v0.18.0

on:
  push:
    branches:
      - 'agent/v0.18-monthly-history-debt'
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0180-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.18 history coherence
        run: |
          if grep -q 'versionName = "0.18.0"' app/build.gradle.kts \
             && grep -q 'ThermalHistoryDebtStore' app/src/main/java/com/fabdata/app/ThermalUi.kt \
             && grep -q 'Station météo officielle' app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo "v0.18 source already generated"
          else
            python3 scripts/apply-v018-history-coherence.py
          fi

      - name: Regression guards
        run: |
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/BackupLayer.kt; then
            echo "ERROR: backup/import format must stay compatible"
            git diff -- app/src/main/java/com/fabdata/app/BackupLayer.kt
            exit 1
          fi
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/DataLayer.kt; then
            echo "ERROR: physical data layer must stay untouched"
            git diff -- app/src/main/java/com/fabdata/app/DataLayer.kt
            exit 1
          fi

          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'versionName = "0.18.0"' app/build.gradle.kts
          grep -q 'MEASURED("measured", 3)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'require(source != PointSource.MEASURED)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'fun deleteBySourceRange' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'private const val MAX_HISTORY_DAYS = 1464' app/src/main/java/com/fabdata/app/ThermalEngine.kt
          grep -q 'maxHistoryDays: Int? = null' app/src/main/java/com/fabdata/app/ThermalEngine.kt
          grep -q 'maxHistoryDays = 366' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -q 'class ThermalHistoryDebtStore' app/src/main/java/com/fabdata/app/ThermalHistoryDebt.kt
          grep -q 'HistoricalDebtState.PAUSED' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'Text("Continuer")' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'Text("Mettre en pause")' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'Text("Annuler")' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'Mettre à jour l.historique ancien' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'fun prepareHistoryRange' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt
          grep -q 'cursor.plusDays(30L)' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt
          grep -q 'Station météo officielle' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Station météo reconstruite' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'weather:official' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'thermal:inertia' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Réinitialiser' app/src/main/java/com/fabdata/app/LyonLabLayer.kt

          python3 - <<'PY'
          from pathlib import Path
          point = Path('app/src/main/java/com/fabdata/app/PointSourceLayer.kt').read_text()
          assert 'require(source != PointSource.MEASURED)' in point
          assert 'deleteBySourceRange' in point

          live = Path('app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt').read_text()
          assert 'delay(300_000L)' in live
          assert 'maxHistoryDays = 366' in live
          assert 'recordDebt' in live

          thermal = Path('app/src/main/java/com/fabdata/app/ThermalUi.kt').read_text()
          assert 'ThermalHistoryChoice("48 mois", 1464)' in thermal
          assert 'processNextHistoryChunk' in thermal
          assert 'beginHistoryWork' in thermal
          assert 'fullHistoryDays > 366' in thermal
          assert 'deleteBySourceRange' in thermal
          assert all(x in thermal for x in ['Continuer','Mettre en pause','Annuler'])

          weather = Path('app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt').read_text()
          assert 'prepareHistoryRange' in weather
          assert 'cursor.plusDays(30L)' in weather

          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          assert 'WEATHER_OFFICIAL_SENSOR_ID' in main
          assert 'Station météo officielle' in main
          assert 'Station météo reconstruite' in main
          assert 'CurvePersonalizationCard(' not in main

          print('v0.18 guards: measured protected, 12-month auto cap, persistent historical debt, monthly oldest-to-newest prep, single curve controls')
          PY

      - name: Commit generated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt \
            app/src/main/java/com/fabdata/app/LyonLabLayer.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt \
            app/src/main/java/com/fabdata/app/ThermalHistoryDebt.kt
          if git diff --cached --quiet; then
            echo "v0.18 source already generated"
          else
            git commit -m "Apply FabData v0.18 monthly history coherence"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.18.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.18.0-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.18.0-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.18.0-release
          path: |
            artifacts/FabData-v0.18.0-release.apk
            artifacts/FabData-v0.18.0-release.aab
            artifacts/FabData-v0.18.0-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.18.0-release.apk artifacts/FabData-v0.18.0-release.aab artifacts/FabData-v0.18.0-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.18.0 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.18.0" \
              --notes "FabData v0.18.0 — courbes météo renommées Station météo officielle / Station météo reconstruite, visibilité et personnalisation réunies dans Superposition avec réinitialisation des styles. Historiques jusqu'à 48 mois préparés par morceaux d'environ un mois, toujours du plus ancien vers le présent. Après chaque morceau : Continuer / Mettre en pause / Annuler, avec reprise persistante. Les recalculs automatiques déclenchés par de nouvelles données ou paramètres sont limités aux 12 derniers mois ; l'historique plus ancien reste enregistré comme dette visible avec bouton de mise à jour. Les mesures MEASURED, sauvegardes et imports restent protégés."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.18.0-release.apk \
            artifacts/FabData-v0.18.0-release.aab \
            artifacts/FabData-v0.18.0-signing-mode.txt \
            --clobber
