name: Android APK + AAB v0.15.0

on:
  push:
    branches:
      - 'agent/**'
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0150-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.15.0 coupled inertia history
        run: |
          # La branche contient déjà le source généré v0.14.0.
          # Ne pas rejouer les anciens générateurs non idempotents.
          python3 scripts/apply-v150-coupled-inertia-history.py

      - name: Regression guard measured data and coupled history
        run: |
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/DataLayer.kt; then
            echo "ERROR: v0.15.0 must not modify measured-data storage"
            git diff -- app/src/main/java/com/fabdata/app/DataLayer.kt
            exit 1
          fi

          POINT_CHANGES="$(git diff --unified=0 -- app/src/main/java/com/fabdata/app/PointSourceLayer.kt | grep -E '^[+-][^+-]' || true)"
          echo "$POINT_CHANGES"
          UNEXPECTED_POINT="$(printf '%s\n' "$POINT_CHANGES" | grep -vE '^[+-]    const val MODEL_VERSION = "thermal-rc-(mass-3|inertia-4)"$' || true)"
          if [ -n "$UNEXPECTED_POINT" ]; then
            echo "ERROR: v0.15.0 may only change PointSource MODEL_VERSION"
            echo "$UNEXPECTED_POINT"
            exit 1
          fi

          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "0.15.0"' app/build.gradle.kts
          grep -q 'MODEL_VERSION = "thermal-rc-inertia-4"' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'mass - a.temperature' app/src/main/java/com/fabdata/app/ThermalEngine.kt
          grep -q 'includeHistory = false' app/src/main/java/com/fabdata/app/ThermalEngine.kt
          grep -q 'reconstruction refusée' app/src/main/java/com/fabdata/app/ThermalEngine.kt
          grep -q 'outsideWeight = best.outsideWeight' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'private fun allHourly' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'Étendre historique météo + bâtiment' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'fabdata_thermal_model' app/src/main/java/com/fabdata/app/MainActivity.kt
          echo "Measured data untouched; training is MEASURED-only; history requires weather + learned inertia"

      - name: Commit generated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt \
            app/src/main/java/com/fabdata/app/ThermalExperimentUi.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          if git diff --cached --quiet; then
            echo "v0.15.0 source already generated"
          else
            git commit -m "Apply FabData v0.15.0 coupled inertia history"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.15.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.15.0-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.15.0-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.15.0-release
          path: |
            artifacts/FabData-v0.15.0-release.apk
            artifacts/FabData-v0.15.0-release.aab
            artifacts/FabData-v0.15.0-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.15.0-release.apk artifacts/FabData-v0.15.0-release.aab artifacts/FabData-v0.15.0-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.15.0 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.15.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.15.0" \
              --notes "FabData v0.15.0 — historique couplé météo + inertie bâtiment. L’apprentissage utilise uniquement les points intérieurs MEASURED propres : périodes clim/fenêtre probable, variations brutales, humidité atypique ou données douteuses restent visibles mais sont exclues de l’entraînement. Le modèle apprend désormais explicitement le terme T_mass−T_air en plus de la météo. Étendre l’historique prépare automatiquement la météo, exige l’inertie apprise, puis reconstruit l’air intérieur sur la même profondeur : pas de courbe historique intérieure sans inertie. Le tourniquet de sonde pilote aussi la courbe inertielle affichée. La profondeur 6/12/24/36 mois et l’overlay de calcul de v0.14 sont conservés."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.15.0-release.apk \
            artifacts/FabData-v0.15.0-release.aab \
            artifacts/FabData-v0.15.0-signing-mode.txt \
            --clobber
