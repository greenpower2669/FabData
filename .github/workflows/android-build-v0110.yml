name: Android APK + AAB v0.17.1

on:
  push:
    branches:
      - 'agent/v0.17.1-focus-crosshair'
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0171-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.17.1 focus cadence and crosshair
        run: |
          if grep -q 'versionName = "0.17.1"' app/build.gradle.kts \
             && grep -q 'delay(300_000L)' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt \
             && grep -q 'var sightTemperature' app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo "v0.17.1 source already generated"
          else
            python3 scripts/apply-v171-focus-crosshair.py
          fi

      - name: Regression guards
        run: |
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/ThermalEngine.kt; then
            echo "ERROR: v0.17.1 must not rewrite the thermal engine"
            git diff -- app/src/main/java/com/fabdata/app/ThermalEngine.kt
            exit 1
          fi
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt; then
            echo "ERROR: v0.17.1 must not rewrite the inertia model"
            git diff -- app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
            exit 1
          fi
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/BackupLayer.kt; then
            echo "ERROR: v0.17.1 must keep backup/import format compatible"
            git diff -- app/src/main/java/com/fabdata/app/BackupLayer.kt
            exit 1
          fi

          grep -q 'versionCode = 33' app/build.gradle.kts
          grep -q 'versionName = "0.17.1"' app/build.gradle.kts
          grep -q 'MEASURED("measured", 3)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'RECONSTRUCTED("reconstructed", 2)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'FORECAST("forecast", 1)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'fun reconcileMeasuredDominance(db: FabDataDb)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'FabLiveUpdateCoordinator(' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'delay(300_000L)' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -q 'if (!foreground || working) return false' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -q 'pendingMeasuredRefresh' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -q 'var sightTemperature' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Vrai crosshair' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Date/heure répétée en haut ET en bas' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Température du crosshair répétée à gauche ET à droite' app/src/main/java/com/fabdata/app/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          live = Path('app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt').read_text()
          assert 'delay(60_000L)' not in live, 'old one-minute cadence remains'
          assert 'delay(300_000L)' in live
          assert 'if (!foreground || working) return false' in live
          assert 'Lifecycle.Event.ON_RESUME -> foreground = true' in live
          assert 'Lifecycle.Event.ON_PAUSE, Lifecycle.Event.ON_STOP -> foreground = false' in live
          assert 'refreshExistingReconstructions' in live

          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          assert 'sightTemperature = range.first + (range.second - range.first)' in main
          assert 'drawLine(\n                    selectColor.copy(alpha = 0.88f)' in main
          assert main.count('drawContext.canvas.nativeCanvas.drawText(timeLabel') == 2
          assert 'left + 4.dp.toPx()' in main and 'right - 4.dp.toPx()' in main

          point = Path('app/src/main/java/com/fabdata/app/PointSourceLayer.kt').read_text()
          delete = point[point.index('fun deleteBySource'):point.index('fun reconstructedBounds')]
          assert 'require(source != PointSource.MEASURED)' in delete
          print('Regression guards: 5-minute foreground-only refresh, immediate resume, true crosshair, measured data protected')
          PY

      - name: Commit generated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          if git diff --cached --quiet; then
            echo "v0.17.1 source already generated"
          else
            git commit -m "Apply FabData v0.17.1 focus refresh and crosshair"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.17.1-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.17.1-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.17.1-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.17.1-release
          path: |
            artifacts/FabData-v0.17.1-release.apk
            artifacts/FabData-v0.17.1-release.aab
            artifacts/FabData-v0.17.1-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.17.1-release.apk artifacts/FabData-v0.17.1-release.aab artifacts/FabData-v0.17.1-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.17.1 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.17.1
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.17.1" \
              --notes "FabData v0.17.1 — cadence live ramenée à 5 minutes et strictement limitée au premier plan. Aucun rafraîchissement météo ni calcul thermique n'est lancé quand l'application est en arrière-plan ; le retour au focus déclenche immédiatement une mise à jour, puis la cadence reprend toutes les 5 minutes. Une nouvelle vraie mesure reçue hors focus est seulement marquée pour être traitée au prochain retour. La visée du graphe devient un crosshair 2D déplaçable : verticale pour date/heure, horizontale pour température, date/heure répétée en haut et en bas, température répétée à gauche et à droite, tout en conservant les valeurs colorées de chaque sonde à leur niveau. Moteur RC, inertie, priorité MEASURED et sauvegardes inchangés."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.17.1-release.apk \
            artifacts/FabData-v0.17.1-release.aab \
            artifacts/FabData-v0.17.1-signing-mode.txt \
            --clobber
