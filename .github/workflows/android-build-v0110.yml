name: Android APK + AAB v0.13.0

on:
  push:
    branches:
      - 'agent/**'
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0130-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.13.0 station protection layer
        run: |
          # Start strictly from the generated and validated v0.12.2 source.
          # No v0.12 generator is replayed here.
          python3 scripts/apply-v130-station-protection.py

      - name: Regression guard RC and reconstruction
        run: |
          if ! git diff --quiet -- \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
            app/src/main/java/com/fabdata/app/DataLayer.kt; then
            echo "ERROR: v0.13.0 must not modify RC/reconstruction/provenance core"
            git diff -- \
              app/src/main/java/com/fabdata/app/ThermalEngine.kt \
              app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
              app/src/main/java/com/fabdata/app/DataLayer.kt
            exit 1
          fi
          grep -q 'versionName = "0.13.0"' app/build.gradle.kts
          grep -q 'StationDiscoveryDialog' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'selectedReference()' app/src/main/java/com/fabdata/app/MainActivity.kt
          echo "RC/reconstruction core unchanged"

      - name: Commit generated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt \
            app/src/main/java/com/fabdata/app/StationDiscovery.kt \
            app/src/main/java/com/fabdata/app/StationDiscoveryUi.kt
          if git diff --cached --quiet; then
            echo "v0.13.0 source already generated"
          else
            git commit -m "Apply FabData v0.13.0 station protection"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.13.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.13.0-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.13.0-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.13.0-release
          path: |
            artifacts/FabData-v0.13.0-release.apk
            artifacts/FabData-v0.13.0-release.aab
            artifacts/FabData-v0.13.0-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.13.0-release.apk artifacts/FabData-v0.13.0-release.aab artifacts/FabData-v0.13.0-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.13.0 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.13.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.13.0" \
              --notes "FabData v0.13.0 — ajoute une couche de sélection de station sans modifier le moteur RC/reconstruction v0.12.2. Recherche par adresse, code postal, ville, coordonnées ou position GPS ; lecture de l'index courant des stations Météo-France ; rayons 25/50/100 km ; tourniquet manuel ; mode Auto protection qui choisit la station du secteur au profil historiquement le plus chaud selon le P95 des maximales juin-septembre sur les 10 dernières années complètes (réanalyse homogène Open-Meteo). Les stations découvertes dynamiquement sont persistées et deviennent la seule référence météo chargée, comme avant. Lyon reste le secours par défaut."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.13.0-release.apk \
            artifacts/FabData-v0.13.0-release.aab \
            artifacts/FabData-v0.13.0-signing-mode.txt \
            --clobber
