name: Android APK + AAB v0.16.0

on:
  push:
    branches:
      - 'agent/v0.16-rationalize-curves'
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0160-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.16.0 rationalization and monitoring-first UI
        run: python3 scripts/apply-v160-rationalize-curves.py

      - name: Regression guards
        run: |
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/DataLayer.kt; then
            echo "ERROR: v0.16 must not modify measured-data storage"
            git diff -- app/src/main/java/com/fabdata/app/DataLayer.kt
            exit 1
          fi
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/BackupLayer.kt; then
            echo "ERROR: v0.16 must keep backup/import format compatible"
            git diff -- app/src/main/java/com/fabdata/app/BackupLayer.kt
            exit 1
          fi

          grep -q 'versionCode = 31' app/build.gradle.kts
          grep -q 'versionName = "0.16.0"' app/build.gradle.kts
          grep -q 'MEASURED("measured", 3)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'RECONSTRUCTED("reconstructed", 2)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'FORECAST("forecast", 1)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'dependency_hash TEXT' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'Une mesure réelle ne peut jamais être invalidée' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'Rationaliser les courbes' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'Profil bâtiment modifié' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'PreviewPreset.entries.forEach' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'TimePreset.entries.forEach' app/src/main/java/com/fabdata/app/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          o = main.index('HistoryOverviewCard(')
          t = main.index('TimeTabs(preset = preset', o)
          c = main.index('ChartCard(', t)
          s = main.index('SensorSourcesCard(', c)
          assert o < t < c < s, 'monitoring-first order broken'
          point = Path('app/src/main/java/com/fabdata/app/PointSourceLayer.kt').read_text()
          delete = point[point.index('fun deleteBySource'):point.index('fun reconstructedBounds')]
          assert 'require(source != PointSource.MEASURED)' in delete
          assert 'source=?' in delete
          print('Regression guards: measured untouched, period controls separate, monitoring first')
          PY

      - name: Commit generated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/ThermalCoherence.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          if git diff --cached --quiet; then
            echo "v0.16.0 source already generated"
          else
            git commit -m "Apply FabData v0.16.0 curve rationalization"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.16.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.16.0-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.16.0-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.16.0-release
          path: |
            artifacts/FabData-v0.16.0-release.apk
            artifacts/FabData-v0.16.0-release.aab
            artifacts/FabData-v0.16.0-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.16.0-release.apk artifacts/FabData-v0.16.0-release.aab artifacts/FabData-v0.16.0-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.16.0 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.16.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.16.0" \
              --notes "FabData v0.16.0 — fiabilisation des recalculs et ergonomie monitoring-first. Les points calculés portent une empreinte légère du profil bâtiment et de leurs dépendances dans la provenance existante. Une modification du profil, des mesures ou de la référence peut invalider les résultats aval sans jamais toucher aux points MEASURED. Le bouton « Rationaliser les courbes » conserve les calculs encore cohérents, retire uniquement les couches calculées périmées/incertaines et réutilise le moteur existant pour les reconstruire. L’ouverture d’une ancienne base reste conservatrice : aucune reconstruction héritée n’est détruite automatiquement au premier affichage. L’interface place désormais Vue globale, boutons de période du détail et graphe détaillé avant les sondes/stations et outils avancés ; les deux contrôles de période restent indépendants. Import/export et format de sauvegarde restent inchangés."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.16.0-release.apk \
            artifacts/FabData-v0.16.0-release.aab \
            artifacts/FabData-v0.16.0-signing-mode.txt \
            --clobber
