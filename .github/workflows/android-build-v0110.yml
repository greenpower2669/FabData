name: Android APK + AAB v0.12.1

on:
  push:
    branches:
      - 'agent/**'
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

# Keep the same group as v0.12.0 so this run cancels any stale v0.12 build
# triggered while the v0.12.1 patch file was being added.
concurrency:
  group: fabdata-v0120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.12.0 base + v0.12.1 history fix
        run: |
          python3 scripts/apply-v120-adaptive-forecast-invalidation.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fabdata/app/ThermalUi.kt')
          t = p.read_text(encoding='utf-8')
          duplicate = '    var profileDialog by remember { mutableStateOf(false) }\n    var profileDialog by remember { mutableStateOf(false) }'
          t = t.replace(duplicate, '    var profileDialog by remember { mutableStateOf(false) }')
          p.write_text(t, encoding='utf-8')
          PY
          python3 scripts/apply-v121-history-gate-fix.py

      - name: Commit generated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/DataLayer.kt \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalProfile.kt \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          if git diff --cached --quiet; then
            echo "v0.12.1 source already generated"
          else
            git commit -m "Apply FabData v0.12.1 history reconstruction fix"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.12.1-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.12.1-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.12.1-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.12.1-release
          path: |
            artifacts/FabData-v0.12.1-release.apk
            artifacts/FabData-v0.12.1-release.aab
            artifacts/FabData-v0.12.1-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.12.1-release.apk artifacts/FabData-v0.12.1-release.aab artifacts/FabData-v0.12.1-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.12.1 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.12.1
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.12.1" \
              --notes "FabData v0.12.1 — corrige la régression de reconstruction passée introduite en v0.12.0. Le garde-fou historique retrouve les critères v0.11 et la sélection du modèle par RMSE court terme ; la dérive libre reste réservée au garde-fou de prévision. Le recalcul automatique d'un historique déjà reconstruit ne se déclenche désormais que lorsqu'une vraie mesure MEASURED a effectivement été ajoutée ou a remplacé un point calculé. Prévision adaptative, sigma, analogues et priorité MEASURED > RECONSTRUCTED > FORECAST conservés."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.12.1-release.apk \
            artifacts/FabData-v0.12.1-release.aab \
            artifacts/FabData-v0.12.1-signing-mode.txt \
            --clobber
