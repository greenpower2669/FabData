name: Android APK + AAB v0.17.0

on:
  push:
    branches:
      - 'agent/v0.17-live-coherence-map'
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0170-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.17.0 live coherence, sight and station map
        run: |
          if grep -q 'versionName = "0.17.0"' app/build.gradle.kts \
             && grep -q 'FabLiveUpdateCoordinator(' app/src/main/java/com/fabdata/app/MainActivity.kt \
             && grep -q 'fun refreshRecent(reference: WeatherReference)' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt; then
            echo "v0.17.0 source already generated"
          else
            python3 scripts/apply-v170-live-coherence-map.py
          fi

      - name: Regression guards
        run: |
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/ThermalEngine.kt; then
            echo "ERROR: v0.17 must not rewrite the thermal engine"
            git diff -- app/src/main/java/com/fabdata/app/ThermalEngine.kt
            exit 1
          fi
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt; then
            echo "ERROR: v0.17 must not rewrite the inertia model"
            git diff -- app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
            exit 1
          fi
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/BackupLayer.kt; then
            echo "ERROR: v0.17 must keep backup/import format compatible"
            git diff -- app/src/main/java/com/fabdata/app/BackupLayer.kt
            exit 1
          fi

          grep -q 'versionCode = 32' app/build.gradle.kts
          grep -q 'versionName = "0.17.0"' app/build.gradle.kts
          grep -q 'org.maplibre.gl:android-sdk:13.4.1' app/build.gradle.kts
          grep -q 'MEASURED("measured", 3)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'RECONSTRUCTED("reconstructed", 2)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'FORECAST("forecast", 1)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'fun reconcileMeasuredDominance(db: FabDataDb)' app/src/main/java/com/fabdata/app/PointSourceLayer.kt
          grep -q 'fun reconcileMeasuredDominance(referenceKey: String)' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt
          grep -q 'fun refreshRecent(reference: WeatherReference)' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt
          grep -q 'SUM(CAST(ROUND(p.temperature \* 1000.0)' app/src/main/java/com/fabdata/app/DataLayer.kt
          grep -q 'FabLiveUpdateCoordinator(' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'grabsSight' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Choisir sur la carte' app/src/main/java/com/fabdata/app/StationDiscoveryUi.kt
          grep -q 'StationMapDialog(' app/src/main/java/com/fabdata/app/StationDiscoveryUi.kt
          grep -q 'stations_xhr.php?format=geojson' app/src/main/java/com/fabdata/app/StationDiscovery.kt
          ! grep -q '\.take(24)' app/src/main/java/com/fabdata/app/StationDiscovery.kt

          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          assert 'windowCenterTimestamp = ts' in main
          assert 'sensor.id == LYON_RECONSTRUCTED_SENSOR_ID' in main
          point = Path('app/src/main/java/com/fabdata/app/PointSourceLayer.kt').read_text()
          delete = point[point.index('fun deleteBySource'):point.index('fun reconstructedBounds')]
          assert 'require(source != PointSource.MEASURED)' in delete
          dominance = point[point.index('fun reconcileMeasuredDominance'):point.index('private fun invalidateForecastsAfterMeasured')]
          assert "c.source<>'measured'" in dominance
          weather = Path('app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt').read_text()
          assert "it.source == PointSource.MEASURED ||" in weather
          live = Path('app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt').read_text()
          assert 'delay(60_000L)' in live
          assert 'refreshExistingReconstructions' in live
          print('Regression guards: real data protected, RC/inertia untouched, live minute loop and station map present')
          PY

      - name: Commit generated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt \
            app/src/main/java/com/fabdata/app/StationDiscovery.kt \
            app/src/main/java/com/fabdata/app/StationDiscoveryUi.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
            app/src/main/java/com/fabdata/app/DataLayer.kt
          if git diff --cached --quiet; then
            echo "v0.17.0 source already generated"
          else
            git commit -m "Apply FabData v0.17.0 live coherence and map"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.17.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.17.0-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.17.0-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.17.0-release
          path: |
            artifacts/FabData-v0.17.0-release.apk
            artifacts/FabData-v0.17.0-release.aab
            artifacts/FabData-v0.17.0-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.17.0-release.apk artifacts/FabData-v0.17.0-release.aab artifacts/FabData-v0.17.0-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.17.0 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.17.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.17.0" \
              --notes "FabData v0.17.0 — raccords réel/calculé fiabilisés, actualisation live et visée enrichie. Une observation MEASURED domine désormais aussi les calculs voisins du même bucket horaire sans jamais supprimer une autre mesure réelle ; les anciennes bases sont lues de façon canonique. Un coordinateur toujours composé actualise la météo au focus puis toutes les 60 s et, lors d'une nouvelle vraie mesure intérieure, enchaîne météo fraîche, inertie/reconstruction existante et prévision. Le moteur RC et l'estimateur inertiel ne sont pas réécrits. La visée se recentre depuis le bandeau, se déplace par drag et affiche heure + températures colorées au niveau de chaque courbe. La découverte des stations n'est plus limitée à 24 candidates ; sans token elle utilise un catalogue public open-data élargi, avec token l'index Météo-France reste prioritaire. Une carte tactile MapLibre/OpenFreeMap permet de choisir directement une station. Import/export et sauvegardes restent compatibles."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.17.0-release.apk \
            artifacts/FabData-v0.17.0-release.aab \
            artifacts/FabData-v0.17.0-signing-mode.txt \
            --clobber
