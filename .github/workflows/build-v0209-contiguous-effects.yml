name: Build FabData v0.20.9 contiguous effects

on:
  push:
    branches:
      - 'agent/v0.20.9-contiguous-history-effects'
    paths:
      - '.github/workflows/build-v0209-contiguous-effects.yml'
      - 'tools/fix_v0209_contiguous_history_effects.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v0.20.9-contiguous-history-effects
          fetch-depth: 0

      - name: Apply v0.20.9 integration
        run: python3 tools/fix_v0209_contiguous_history_effects.py

      - name: Regression guards
        run: |
          git diff --check
          grep -q 'fun continuousHistoryRange' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt
          grep -q 'continuousDepthDays = actualDepth' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt
          ! grep -q 'alreadyLoadedDays = migration.reconstructedDepthDays' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'weatherMigrationStore.setReconstructedDepth(depth)' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'val effectA: String = "NONE"' app/src/main/java/com/fabdata/app/LyonLabLayer.kt
          grep -q 'FIREWORKS' app/src/main/java/com/fabdata/app/LyonLabLayer.kt
          grep -q 'drawCurveDecorations' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'versionName = "0.20.9"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Commit integrated source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/DataLayer.kt \
            app/src/main/java/com/fabdata/app/LyonLabLayer.kt \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceMigration.kt
          if git diff --cached --quiet; then
            echo "No source patch to commit"
          else
            git commit -m "Fix contiguous weather extension and add living curve effects"
            git push origin HEAD:agent/v0.20.9-contiguous-history-effects
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.20.9-contiguous-effects-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.20.9-contiguous-effects-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.20.9-contiguous-effects-signing-mode.txt
          sha256sum artifacts/FabData-v0.20.9-contiguous-effects-release.apk artifacts/FabData-v0.20.9-contiguous-effects-release.aab > artifacts/FabData-v0.20.9-contiguous-effects-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.20.9-contiguous-effects
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release delete v0.20.9-contiguous-effects --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.20.9-contiguous-effects \
            --target "$TARGET_SHA" \
            --title "FabData v0.20.9 contiguous history + living effects" \
            --notes "Corrige l'extension météo +90 j : le curseur repart désormais du bord réellement continu de la station et ne saute plus un trou à cause d'un compteur de clics. La profondeur affichée est recalculée depuis les données réelles et un bloc incomplet est retenté. Les bandeaux ne relient plus visuellement de gros trous météo. Ajoute 16 couleurs de base et une troisième couche de personnalisation des courbes : effets A/B, densité, orbite, mode aléatoire, étincelles, feu d'artifice, mouches, gouttes, fumée, poissons, oiseaux, comètes, bulles, lucioles, papillons, pluie et planètes. Couleurs et auras enrichies. Sauvegarde v4 et navigateur v0.20.8 conservés." \
            artifacts/FabData-v0.20.9-contiguous-effects-release.apk \
            artifacts/FabData-v0.20.9-contiguous-effects-release.aab \
            artifacts/FabData-v0.20.9-contiguous-effects-signing-mode.txt \
            artifacts/FabData-v0.20.9-contiguous-effects-sha256.txt
