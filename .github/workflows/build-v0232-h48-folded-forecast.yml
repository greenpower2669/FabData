name: Build v0.23.2 H48 folded forecasts

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastAdaptive.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastAdaptiveUi.kt'
      - 'app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt'
      - 'app/src/main/java/com/fabdata/app/UiPreferenceStore.kt'
      - 'app/src/main/java/com/fabdata/app/MainActivity.kt'
      - 'tools/patch_v0232_core.py'
      - 'tools/patch_v0232_ui.py'
      - '.github/workflows/build-v0232-h48-folded-forecast.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Validate patches
        run: |
          python3 -m py_compile tools/patch_v0232_core.py
          python3 -m py_compile tools/patch_v0232_ui.py

      - name: Apply v0.23.2 patch
        run: |
          python3 tools/patch_v0232_core.py
          python3 tools/patch_v0232_ui.py

      - name: Regression guard
        run: |
          git diff --check
          grep -n 'versionName = "0.23.2"' app/build.gradle.kts
          grep -n 'FORECAST_HORIZON_HOURS: IntRange = 1..48' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'listOf(3, 6, 12, 24, 48)' app/src/main/java/com/fabdata/app/ForecastAdaptive.kt
          grep -n 'now + 50L \* ADAPTIVE_HOUR_MS' app/src/main/java/com/fabdata/app/ForecastAdaptive.kt
          grep -n 'delay(600_000L)' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -n 'PeriodicWorkRequestBuilder<ForecastArchiveWorker>(15, TimeUnit.MINUTES)' app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt
          grep -n 'ExistingPeriodicWorkPolicy.UPDATE' app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt
          grep -n 'adaptiveForecastExpanded' app/src/main/java/com/fabdata/app/UiPreferenceStore.kt
          grep -n 'FORECAST_DISPLAY_FUTURE_MS + 60L' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévisions météo · active + H+1 → H+48' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévisions Fab · adaptatives jusqu’à H+48' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'val defaultVisible = lead == 24' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'sensor.id != FORECAST_ACTIVE_SENSOR_ID' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'H+48 · apprentissage causal' app/src/main/java/com/fabdata/app/ForecastAdaptiveUi.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FabData-v0.23.2-release-h48-folded-forecast.apk

      - name: Commit validated source
        run: |
          if git diff --quiet; then
            echo "v0.23.2 source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts \
                    app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt \
                    app/src/main/java/com/fabdata/app/ForecastAdaptive.kt \
                    app/src/main/java/com/fabdata/app/ForecastAdaptiveUi.kt \
                    app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt \
                    app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt \
                    app/src/main/java/com/fabdata/app/UiPreferenceStore.kt \
                    app/src/main/java/com/fabdata/app/MainActivity.kt
            git commit -m "Add H+48 forecast horizons and folded selectors [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.2-release-h48-folded-forecast
          path: app/build/outputs/apk/debug/FabData-v0.23.2-release-h48-folded-forecast.apk
          if-no-files-found: error
