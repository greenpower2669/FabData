name: Build v0.23.9 compact cascade UI APK

on:
  push:
    branches:
      - feature/v0239-compact-cascade-ui
    paths:
      - 'app/**'
      - 'tools/patch_v0239_compact_cascade_ui.py'
      - 'tools/patch_v0239_right_edge_future_month.py'
      - 'tools/patch_v0239_band3_independent_paging.py'
      - 'vigilance.md'
      - '.github/workflows/build-v0239-compact-cascade-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compact cascade branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0239-compact-cascade-ui
          fetch-depth: 0

      - name: Apply compact cascade UI patch once
        shell: bash
        run: |
          if grep -q 'overviewDisplayBounds' app/src/main/java/com/fabdata/app/MainActivity.kt && \
             grep -q 'Startup policy: the floating tangent cockpit begins compact' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt; then
            echo 'Compact cascade UI patch already present'
          else
            python tools/patch_v0239_compact_cascade_ui.py
          fi

      - name: Apply right-edge and future-month patch once
        shell: bash
        run: |
          if grep -q 'OVERVIEW_FUTURE_MONTH_MS' app/src/main/java/com/fabdata/app/MainActivity.kt && \
             grep -q 'exploration_context_multiplier' app/src/main/java/com/fabdata/app/MainActivity.kt && \
             grep -q 'Band 3 is intentionally independent' app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo 'Right-edge/future-month patch already present'
          else
            python tools/patch_v0239_right_edge_future_month.py
          fi

      - name: Keep band 3 paging independent
        shell: bash
        run: |
          if grep -q 'fun requestExplorationPage' app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo 'Independent band-3 paging already present'
          else
            python tools/patch_v0239_band3_independent_paging.py
          fi

      - name: Commit patched source
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/com/fabdata/app/MainActivity.kt app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/fabdata/app/MainActivity.kt app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt
            git commit -m 'Keep exploration paging independent from detail [skip ci]'
            git push origin HEAD:feature/v0239-compact-cascade-ui
          else
            echo 'No source changes to commit'
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Make UI test install beside normal FabData
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          needle = '''        release {\n            isMinifyEnabled = true\n'''
          replacement = '''        release {\n            applicationIdSuffix = ".uicascade239test"\n            versionNameSuffix = "-ui-cascade-test"\n            isMinifyEnabled = true\n'''
          if needle not in text:
              raise SystemExit('release block not found')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          if manifest.exists():
              m = manifest.read_text(encoding='utf-8')
              m = m.replace('android:label="FabData"', 'android:label="FabData 0.23.9 UI TEST"')
              manifest.write_text(m, encoding='utf-8')

      - name: Build release candidate
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage candidate only
        shell: bash
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/release/app-release.apk ci-artifacts/FabData-v0.23.9-compact-cascade-ui-test.apk
          sha256sum ci-artifacts/FabData-v0.23.9-compact-cascade-ui-test.apk > ci-artifacts/FabData-v0.23.9-compact-cascade-ui-test-sha256.txt
          ls -lh ci-artifacts/

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.9-compact-cascade-ui-test
          path: |
            ci-artifacts/FabData-v0.23.9-compact-cascade-ui-test.apk
            ci-artifacts/FabData-v0.23.9-compact-cascade-ui-test-sha256.txt
          if-no-files-found: error
          retention-days: 30
