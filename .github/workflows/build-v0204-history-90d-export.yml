name: Build FabData v0.20.4 history 90d export

on:
  push:
    branches:
      - 'agent/v0.20.4-history-90d-export'
    paths:
      - '.github/workflows/build-v0204-history-90d-export.yml'
      - 'tools/fix_v0204_history_90d_export.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v0.20.4-history-90d-export
          fetch-depth: 0

      - name: Apply v0.20.4 history/export fix
        run: python3 tools/fix_v0204_history_90d_export.py

      - name: Diff guard
        run: |
          git diff --check
          git diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Commit patched source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/fabdata/app/ThermalHistoryDebt.kt \
            app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
            app/src/main/java/com/fabdata/app/SourceExportLayer.kt \
            app/src/main/java/com/fabdata/app/BackupLayer.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt
          if git diff --cached --quiet; then
            echo "No source patch to commit"
          else
            git commit -m "Limit history extension to manual 90-day blocks and export sensor provenance"
            git push origin HEAD:agent/v0.20.4-history-90d-export
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.20.4-history-90d-export-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.20.4-history-90d-export-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.20.4-history-90d-export-signing-mode.txt
          sha256sum artifacts/FabData-v0.20.4-history-90d-export-release.apk artifacts/FabData-v0.20.4-history-90d-export-release.aab > artifacts/FabData-v0.20.4-history-90d-export-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.20.4-history-90d-export
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release delete v0.20.4-history-90d-export --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.20.4-history-90d-export \
            --target "$TARGET_SHA" \
            --title "FabData v0.20.4 history 90d export" \
            --notes "Historique intérieur par blocs manuels de 90 jours maximum : préparation visible en ~3 morceaux puis arrêt. Un nouveau +90 j n'est lancé que sur demande. Ajout de l'export de la sonde sélectionnée (réel + reconstruit) sous son identité stable d'origine. Les points RECONSTRUCTED restent remplaçables par MEASURED et un ancien export calculé ne peut plus écraser une reconstruction plus récente." \
            artifacts/FabData-v0.20.4-history-90d-export-release.apk \
            artifacts/FabData-v0.20.4-history-90d-export-release.aab \
            artifacts/FabData-v0.20.4-history-90d-export-signing-mode.txt \
            artifacts/FabData-v0.20.4-history-90d-export-sha256.txt
