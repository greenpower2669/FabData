name: Android APK + AAB v0.19.8 persistent manual training

on:
  push:
    branches:
      - 'agent/v0.19.8-manual-persistent-training'
    paths:
      - 'scripts/apply-v0198-manual-persistent-training.py'
      - '.github/workflows/android-build-v0198-manual-persistent-training.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0198-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.19.8 correction
        run: python3 scripts/apply-v0198-manual-persistent-training.py

      - name: Paradigm and regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts').read_text()
          engine = Path('app/src/main/java/com/fabdata/app/ThermalEngine.kt').read_text()
          inertia = Path('app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt').read_text()
          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          ui = Path('app/src/main/java/com/fabdata/app/ThermalUi.kt').read_text()
          live = Path('app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt').read_text()
          store = Path('app/src/main/java/com/fabdata/app/ThermalTrainedModelStore.kt').read_text()
          coh = Path('app/src/main/java/com/fabdata/app/ThermalCoherence.kt').read_text()

          required = {
              'version': ('versionName = "0.19.8"', build),
              'persisted store': ('class ThermalTrainedModelStore', store),
              'dirty model': ('fun markDirty', store),
              'stable signature': ('fun ThermalModel.stableSignature()', store),
              'explicit train': ('fun trainModel(', engine),
              'passive status': ('fun statusFromTrainedModel(', engine),
              'frozen forecast': ('precalibratedModel: ThermalModel? = null', engine),
              'cheap inertia projection': ('fun projectTrained(', inertia),
              'chart frozen model': ('inertiaEstimator.projectTrained', main),
              'selection dirties model': ('trainedModelStore.markDirty("Sélection d’apprentissage modifiée")', main),
              'blinking button': ('⚠ Entraîner modèle', ui),
              'history resume warning': ('⚠ Reprendre chargement morcelé', ui),
              'live future only': ('Live mode only refreshes the future', live),
              'model fingerprint': ('trainedModel?.stableSignature()', coh),
              'selector preserved': ('Sélectionner une période', main),
              'help preserved': ('? Aide', main),
          }
          for name, (needle, haystack) in required.items():
              assert needle in haystack, f'missing guard {name}: {needle}'

          # No automatic historical rebuilding in the always-on coordinator.
          assert 'engine.refreshExistingReconstructions' not in live
          # Live forecast must never call calibrate implicitly: it passes the frozen model.
          assert 'precalibratedModel = trainedModel' in live
          # Main graph load must never call the expensive inertia fit.
          load_area = main[main.find('val trainedModel = trainedModelStore.loadUsable'):]
          assert 'inertiaEstimator.estimate(' not in load_area[:800]
          # User selection invalidates training, never RAW.
          assert 'delete' not in main[main.find('Zone réintégrée · modèle à réentraîner')-500:main.find('Zone réintégrée · modèle à réentraîner')+300].lower()
          # Core ground equation remains present.
          assert 'mass + k * (outside - mass)' in engine or 'mass + k * (tout - mass)' in engine or 'target = mass + k * (tout - mass)' in engine

          print('v0.19.8 persistent-manual-training guards OK')
          PY

          git fetch origin tag v0.19.7 --force || true
          for f in \
            app/src/main/java/com/fabdata/app/BackupLayer.kt \
            app/src/main/java/com/fabdata/app/DataLayer.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt; do
            git diff --quiet v0.19.7 -- "$f" || { echo "ERROR protected file changed: $f"; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.19.8-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.19.8-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.19.8-signing-mode.txt
          sha256sum artifacts/FabData-v0.19.8-release.apk artifacts/FabData-v0.19.8-release.aab > artifacts/FabData-v0.19.8-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.19.8-release
          path: |
            artifacts/FabData-v0.19.8-release.apk
            artifacts/FabData-v0.19.8-release.aab
            artifacts/FabData-v0.19.8-signing-mode.txt
            artifacts/FabData-v0.19.8-sha256.txt
          if-no-files-found: error

      - name: Commit correction and packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalUi.kt \
            app/src/main/java/com/fabdata/app/ThermalEngine.kt \
            app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt \
            app/src/main/java/com/fabdata/app/ThermalCoherence.kt \
            app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt \
            app/src/main/java/com/fabdata/app/ThermalTrainedModelStore.kt \
            artifacts/FabData-v0.19.8-release.apk \
            artifacts/FabData-v0.19.8-release.aab \
            artifacts/FabData-v0.19.8-signing-mode.txt \
            artifacts/FabData-v0.19.8-sha256.txt
          git commit -m "Release FabData v0.19.8 persistent manual training"
          git push

      - name: Publish v0.19.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='FabData v0.19.8 — changement de paradigme thermique. Le modèle complet (projection k/Δ + paramètres d inertie bi-masse) est désormais entraîné explicitement puis persisté. Les nouvelles mesures ne déclenchent plus de réentraînement ni de recalcul automatique du passé. Le mode live ne fait que rafraîchir la météo récente et le futur avec le modèle figé. Si aucun modèle utilisable n existe, le bouton Entraîner modèle clignote à côté de l extension historique. Une modification des zones d apprentissage marque le modèle à réentraîner sans toucher aux RAW. Le chargement historique morcelé reste enregistré et un bouton warning Reprendre chargement morcelé apparaît en haut si une session interrompue existe. Le graphe réel projette l inertie à partir des paramètres figés sans relancer la recherche lourde. Les calculs historiques restent uniquement manuels via les commandes existantes.'
          gh release create v0.19.8 \
            --target "$(git rev-parse HEAD)" \
            --title "FabData v0.19.8" \
            --notes "$NOTES" \
            artifacts/FabData-v0.19.8-release.apk \
            artifacts/FabData-v0.19.8-release.aab \
            artifacts/FabData-v0.19.8-signing-mode.txt \
            artifacts/FabData-v0.19.8-sha256.txt
