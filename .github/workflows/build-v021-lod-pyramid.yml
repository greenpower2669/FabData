name: Build FabData v0.21 LOD pyramid

on:
  push:
    branches:
      - 'agent/v0.21-lod-pyramid'
    paths:
      - '.github/workflows/build-v021-lod-pyramid.yml'
      - 'tools/fix_v021_lod_pyramid.py'
      - 'tools/fix_v021_lod_compile_guards.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v0.21-lod-pyramid
          fetch-depth: 0

      - name: Apply v0.21 LOD pyramid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/fix_v021_lod_pyramid.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "t = replace_once(t, old, new, 'overview hint')",
              "t = t.replace(old, new, 1) if old in t else t"
          )
          p.write_text(s, encoding='utf-8')
          PY
          python3 tools/fix_v021_lod_pyramid.py
          python3 tools/fix_v021_lod_compile_guards.py

      - name: Regression diagnostics
        run: |
          git diff --check || true
          echo '--- LOD symbols ---'
          grep -n 'fun querySamplesLod' app/src/main/java/com/fabdata/app/DataLayer.kt || true
          grep -n 'fun queryLod' app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt || true
          grep -n 'fun queryLod' app/src/main/java/com/fabdata/app/ThermalInertiaHistory.kt || true
          grep -n 'Navigation giga\|Courbes du bandeau\|gigaOverviewSamples\|navigatorOverviewSamples\|explorationOverviewSamples' app/src/main/java/com/fabdata/app/MainActivity.kt || true
          grep -n 'CancellationException' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt || true
          grep -n 'versionName = "0.21.0"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Commit integrated source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/fabdata/app/DataLayer.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt \
            app/src/main/java/com/fabdata/app/ThermalInertiaHistory.kt \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          if git diff --cached --quiet; then
            echo "No source patch to commit"
          else
            git commit -m "Add SQL LOD navigation pyramid"
            git push origin HEAD:agent/v0.21-lod-pyramid
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.21.0-lod-pyramid-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.21.0-lod-pyramid-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.21.0-lod-pyramid-signing-mode.txt
          sha256sum artifacts/FabData-v0.21.0-lod-pyramid-release.apk artifacts/FabData-v0.21.0-lod-pyramid-release.aab > artifacts/FabData-v0.21.0-lod-pyramid-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.21.0-lod-pyramid
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release delete v0.21.0-lod-pyramid --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.21.0-lod-pyramid \
            --target "$TARGET_SHA" \
            --title "FabData v0.21.0 LOD pyramid" \
            --notes "Nouvelle pyramide de navigation conçue pour alléger FabData : bandeau giga mensuel -> navigation intermédiaire journalière -> exploration 6 h -> graphe détaillé. Les agrégats sont calculés directement dans SQLite avant chargement en mémoire. Le bandeau d'exploration propose désormais 1 semaine, 1 mois, 3 mois puis les périodes longues. L'utilisateur choisit les courbes visibles dans les bandeaux ; par défaut FabData privilégie la température intérieure reconstruite et le sol inertiel quand ils existent. Les gros trous restent des trous. Les annulations normales de coroutine Compose ne sont plus affichées comme erreurs. Effets visuels v0.20.9, sauvegarde V4, sélection d'entraînement et historique météo continu sont conservés." \
            artifacts/FabData-v0.21.0-lod-pyramid-release.apk \
            artifacts/FabData-v0.21.0-lod-pyramid-release.aab \
            artifacts/FabData-v0.21.0-lod-pyramid-signing-mode.txt \
            artifacts/FabData-v0.21.0-lod-pyramid-sha256.txt
