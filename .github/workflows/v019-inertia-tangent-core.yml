name: FabData v0.19 inertia tangent core

on:
  push:
    branches:
      - 'agent/v0.19-inertia-tangent-context-mask-help'
    paths:
      - 'scripts/apply-v019-inertia-tangent-core.py'
      - '.github/workflows/v019-inertia-tangent-core.yml'
      - 'app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply tangent core patch
        run: python3 scripts/apply-v019-inertia-tangent-core.py

      - name: Validate v0.19 invariants
        run: |
          grep -q 'val trainingMaskStore = ThermalTrainingMaskStore(db)' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'val effectiveTau = tauHours / (1.0 + 0.55 \* regime)' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'private fun tangentPenalty' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'private fun regimeConfidence' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'CREATE TABLE IF NOT EXISTS thermal_training_exclusions' app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt
          grep -q 'source = PointSource.RECONSTRUCTED' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'WHERE p.sensor_id=? AND (ps.source IS NULL OR ps.source=.measured.)' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Commit source only after successful compile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          if git diff --cached --quiet; then
            echo "v0.19 tangent core already applied"
          else
            git commit -m "Apply FabData v0.19 inertia tangent core"
            git push
          fi
