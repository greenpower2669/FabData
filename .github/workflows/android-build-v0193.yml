name: Android APK + AAB v0.19.3

on:
  push:
    branches:
      - 'agent/v0.19.3-lazy-thermal-ui-anr-fix'
    paths:
      - '.github/workflows/android-build-v0193.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0193-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v0.19.3 regression guards
        run: |
          grep -q 'versionCode = 39' app/build.gradle.kts
          grep -q 'versionName = "0.19.3"' app/build.gradle.kts
          grep -q 'private data class ThermalUiRuntime' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'var runtime by remember(db)' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'val built = withContext(Dispatchers.IO)' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'Initialisation thermique en arrière-plan' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'val manager = readyRuntime.manager' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'withContext(Dispatchers.IO) {' app/src/main/java/com/fabdata/app/ThermalUi.kt
          grep -q 'Sélectionner une période' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q "Utiliser cette zone pour entraîner l'inertie" app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q "Exclure cette zone du modèle d'inertie" app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'Utiliser cette zone comme nouveau zoom' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q '? Aide' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q '! Astuce du jour' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'RangeSelectionHelpDemo' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'private fun tangentPenalty' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'private fun regimeConfidence' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt

          git fetch origin tag v0.19.2 --force || true
          if git rev-parse v0.19.2 >/dev/null 2>&1; then
            for f in \
              app/src/main/java/com/fabdata/app/BackupLayer.kt \
              app/src/main/java/com/fabdata/app/DataLayer.kt \
              app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
              app/src/main/java/com/fabdata/app/ThermalEngine.kt \
              app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt \
              app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt \
              app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt \
              app/src/main/java/com/fabdata/app/MainActivity.kt; do
              if ! git diff --quiet v0.19.2 -- "$f"; then
                echo "ERROR: protected v0.19.2 file changed: $f"
                git diff -- v0.19.2 -- "$f"
                exit 1
              fi
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug first
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.19.3-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.19.3-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.19.3-signing-mode.txt
          sha256sum artifacts/FabData-v0.19.3-release.apk artifacts/FabData-v0.19.3-release.aab > artifacts/FabData-v0.19.3-sha256.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.19.3-release
          path: |
            artifacts/FabData-v0.19.3-release.apk
            artifacts/FabData-v0.19.3-release.aab
            artifacts/FabData-v0.19.3-signing-mode.txt
            artifacts/FabData-v0.19.3-sha256.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.19.3-release.apk artifacts/FabData-v0.19.3-release.aab artifacts/FabData-v0.19.3-signing-mode.txt artifacts/FabData-v0.19.3-sha256.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.19.3 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.19.3
        run: |
          NOTES='FabData v0.19.3 — correctif ANR au défilement avec base réelle chargée. La carte Référence météo & moteur thermique est composée tardivement dans le LazyColumn ; ses objets liés à SQLite étaient auparavant construits sur le thread UI au premier scroll. Leur initialisation est maintenant entièrement déplacée dans Dispatchers.IO, avec un état léger Initialisation thermique en arrière-plan. Deux lectures/calculs de secours thermiques sont également hors thread UI. Le sélectionneur de périodes, les aides ?/!, la micro-démo, les RAW, imports, moteur RC, moteur inertiel v0.19 et appui long = zoom 48 h restent inchangés.'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.19.3" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.19.3-release.apk \
            artifacts/FabData-v0.19.3-release.aab \
            artifacts/FabData-v0.19.3-signing-mode.txt \
            artifacts/FabData-v0.19.3-sha256.txt \
            --clobber
