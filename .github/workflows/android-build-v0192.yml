name: Android APK + AAB v0.19.2

on:
  push:
    branches:
      - 'agent/v0.19.2-anr-main-thread-db-fix'
    paths:
      - '.github/workflows/android-build-v0192.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0192-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v0.19.2 regression guards
        run: |
          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'versionName = "0.19.2"' app/build.gradle.kts
          ! grep -q 'val thermalTrainingMaskStore = remember' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'ThermalTrainingMaskStore(db).includeRange' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'ThermalTrainingMaskStore(db).addMerged' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q '? Aide' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q '! Astuce du jour' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'RangeSelectionHelpDemo' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -q 'private fun tangentPenalty' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'private fun regimeConfidence' app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          grep -q 'fun includeRange' app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt
          grep -q 'fun addMerged' app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt

          git fetch origin tag v0.19.1 --force || true
          if git rev-parse v0.19.1 >/dev/null 2>&1; then
            for f in \
              app/src/main/java/com/fabdata/app/BackupLayer.kt \
              app/src/main/java/com/fabdata/app/DataLayer.kt \
              app/src/main/java/com/fabdata/app/PointSourceLayer.kt \
              app/src/main/java/com/fabdata/app/ThermalEngine.kt \
              app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt \
              app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt \
              app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt; do
              if ! git diff --quiet v0.19.1 -- "$f"; then
                echo "ERROR: protected v0.19.1 file changed: $f"
                git diff -- v0.19.1 -- "$f"
                exit 1
              fi
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug first
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.19.2-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.19.2-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.19.2-signing-mode.txt
          sha256sum artifacts/FabData-v0.19.2-release.apk artifacts/FabData-v0.19.2-release.aab > artifacts/FabData-v0.19.2-sha256.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.19.2-release
          path: |
            artifacts/FabData-v0.19.2-release.apk
            artifacts/FabData-v0.19.2-release.aab
            artifacts/FabData-v0.19.2-signing-mode.txt
            artifacts/FabData-v0.19.2-sha256.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.19.2-release.apk artifacts/FabData-v0.19.2-release.aab artifacts/FabData-v0.19.2-signing-mode.txt artifacts/FabData-v0.19.2-sha256.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.19.2 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.19.2
        run: |
          NOTES='FabData v0.19.2 — correctif ANR de démarrage de la v0.19.1. Le store des zones d apprentissage initialisait SQLite dans le thread UI pendant la composition Compose ; sur une base réelle cela pouvait bloquer l application et déclencher Android ne répond pas. La construction du store est maintenant faite uniquement dans Dispatchers.IO au moment où l utilisateur inclut ou exclut une période. Aucun changement du moteur inertiel, des RAW, des imports, du moteur RC, des aides ?/!, de la micro-démo ou du contrat appui long = zoom 48 h.'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "FabData v0.19.2" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.19.2-release.apk \
            artifacts/FabData-v0.19.2-release.aab \
            artifacts/FabData-v0.19.2-signing-mode.txt \
            artifacts/FabData-v0.19.2-sha256.txt \
            --clobber
