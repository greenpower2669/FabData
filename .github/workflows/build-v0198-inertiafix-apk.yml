name: Build FabData v0.19.8 inertia fix APK

on:
  push:
    branches:
      - 'agent/v0.19.8-inertiafix-apk'
    paths:
      - '.github/workflows/build-v0198-inertiafix-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui = Path('app/src/main/java/com/fabdata/app/ThermalUi.kt').read_text()
          engine = Path('app/src/main/java/com/fabdata/app/ThermalEngine.kt').read_text()
          inertia = Path('app/src/main/java/com/fabdata/app/ThermalInertiaHistory.kt').read_text()
          main = Path('app/src/main/java/com/fabdata/app/MainActivity.kt').read_text()
          assert 'Prolonger le sol inertiel' in ui
          assert 'modèle non entraîné' in ui
          assert 'statusFromTrainedModel' in ui
          assert 'realDays' in engine
          assert 'ThermalInertiaHistory' in inertia
          assert 'PointSource.RECONSTRUCTED' in inertia
          assert '31' in inertia
          assert 'inertiaHistory' in main or 'historicalInertia' in main or 'loadValidated' in main
          print('sensor selector + inertial history guards OK')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore signing
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.19.8-inertiafix1-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.19.8-inertiafix1-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.19.8-inertiafix1-signing-mode.txt
          sha256sum artifacts/FabData-v0.19.8-inertiafix1-release.apk artifacts/FabData-v0.19.8-inertiafix1-release.aab > artifacts/FabData-v0.19.8-inertiafix1-sha256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.19.8-inertiafix1
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.19.8-inertiafix1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.19.8-inertiafix1 \
            --target "$GITHUB_SHA" \
            --title "FabData v0.19.8 inertia fix" \
            --notes "Build de test avec correction du sélecteur de sondes intérieures et ajout du prolongement manuel du sol inertiel, validé mois par mois du passé vers le présent, sans réentraînement automatique." \
            artifacts/FabData-v0.19.8-inertiafix1-release.apk \
            artifacts/FabData-v0.19.8-inertiafix1-release.aab \
            artifacts/FabData-v0.19.8-inertiafix1-signing-mode.txt \
            artifacts/FabData-v0.19.8-inertiafix1-sha256.txt
