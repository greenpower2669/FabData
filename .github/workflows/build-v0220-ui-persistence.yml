name: Build v0.22.0 persistent UI state

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'app/src/main/java/com/fabdata/app/UiPreferenceStore.kt'
      - 'tools/patch_ui_persistence_v0220.py'
      - '.github/workflows/build-v0220-ui-persistence.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Apply persistent UI patch
        run: python3 tools/patch_ui_persistence_v0220.py

      - name: Regression guard
        run: |
          git diff --check
          grep -n 'versionName = "0.22.0"' app/build.gradle.kts
          grep -n 'class UiPreferenceStore' app/src/main/java/com/fabdata/app/UiPreferenceStore.kt
          grep -n 'curve_temp:' app/src/main/java/com/fabdata/app/UiPreferenceStore.kt
          grep -n 'saveWindowCenter' app/src/main/java/com/fabdata/app/UiPreferenceStore.kt
          grep -n 'Archives météo H+1 → H+23' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'forecastHorizonLeadForSensorId(sensor.id) == null' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'uiPrefs.saveCurveTemperature' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'historyUiPrefs.savePreviewZoom' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'uiPrefs.saveTimePresetName' app/src/main/java/com/fabdata/app/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize release APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FabData-v0.22.0-release-ui-persistence.apk

      - name: Commit validated source
        run: |
          if git diff --quiet -- app/build.gradle.kts app/src/main/java/com/fabdata/app/MainActivity.kt; then
            echo "Persistent UI source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts \
                    app/src/main/java/com/fabdata/app/MainActivity.kt
            git commit -m "Persist UI choices and fold forecast archives [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.22.0-release-ui-persistence
          path: app/build/outputs/apk/debug/FabData-v0.22.0-release-ui-persistence.apk
          if-no-files-found: error
