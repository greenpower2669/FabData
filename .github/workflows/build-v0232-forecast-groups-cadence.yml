name: Build v0.23.2 H48 forecast groups

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/forecast-fixed-lead-h24'
    paths:
      - 'tools/fix_v0232_forecast_groups_cadence.py'
      - '.github/workflows/build-v0232-forecast-groups-cadence.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/fabdata/app/ForecastAdaptive.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastAdaptiveUi.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt'
      - 'app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt'
      - 'app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt'
      - 'app/src/main/java/com/fabdata/app/UiPreferenceStore.kt'
      - 'app/src/main/java/com/fabdata/app/MainActivity.kt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/forecast-fixed-lead-h24
          fetch-depth: 0

      - name: Apply v0.23.2 patch
        run: |
          python3 -m py_compile tools/fix_v0232_forecast_groups_cadence.py
          python3 tools/fix_v0232_forecast_groups_cadence.py

      - name: Regression guards
        run: |
          git diff --check
          grep -n 'versionName = "0.23.2"' app/build.gradle.kts
          grep -n 'FORECAST_HORIZON_HOURS: IntRange = 1..48' app/src/main/java/com/fabdata/app/ForecastHorizonArchive.kt
          grep -n 'listOf(1, 3, 6, 12, 24, 48)' app/src/main/java/com/fabdata/app/ForecastAdaptive.kt
          grep -n 'now + 50L \* ADAPTIVE_HOUR_MS' app/src/main/java/com/fabdata/app/ForecastAdaptive.kt
          grep -n 'FORECAST_DISPLAY_FUTURE_MS = 48L' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'lead != 24' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévisions météo · autres horizons jusqu’à H+48' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'Prévisions Fab · autres horizons jusqu’à H+48' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'defaultVisible = lead == 24' app/src/main/java/com/fabdata/app/MainActivity.kt
          grep -n 'adaptiveForecastExpanded()' app/src/main/java/com/fabdata/app/UiPreferenceStore.kt
          grep -n 'LIVE_FORECAST_INTERVAL_MS = 10L' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -n 'MAX(updated_at).*source=.forecast' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -n 'updateLive(force = true)' app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
          grep -n 'PeriodicWorkRequestBuilder<ForecastArchiveWorker>(15, TimeUnit.MINUTES)' app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt
          grep -n 'ExistingPeriodicWorkPolicy.UPDATE' app/src/main/java/com/fabdata/app/ForecastArchiveWorker.kt
          grep -n 'CREATE TRIGGER IF NOT EXISTS' app/src/main/java/com/fabdata/app/ForecastMemoryOverlay.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Normalize APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FabData-v0.23.2-release-h48-groups.apk

      - name: Commit validated source
        run: |
          if git diff --quiet; then
            echo "v0.23.2 source already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts \
                    app/src/main/java/com/fabdata/app/ForecastAdaptive.kt \
                    app/src/main/java/com/fabdata/app/ForecastAdaptiveUi.kt \
                    app/src/main/java/com/fabdata/app/MainActivity.kt \
                    app/src/main/java/com/fabdata/app/LiveUpdateCoordinator.kt
            git commit -m "Pin H24, fold H48 forecasts and throttle refresh [skip ci]"
            git push origin HEAD:feature/forecast-fixed-lead-h24
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.23.2-release-h48-groups
          path: app/build/outputs/apk/debug/FabData-v0.23.2-release-h48-groups.apk
          if-no-files-found: error
