name: Android APK

on:
  push:
    branches:
      - 'agent/**'
    paths-ignore:
      - 'artifacts/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage named APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/FabData-v0.4-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.4-debug
          path: artifacts/FabData-v0.4-debug.apk
          if-no-files-found: error

      - name: Publish APK on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/FabData-v0.4-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build FabData v0.4 APK"
            git push
          fi
