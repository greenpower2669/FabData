name: Android APK + AAB

on:
  push:
    branches:
      - 'agent/**'
    paths-ignore:
      - 'artifacts/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source patches
        run: |
          python3 scripts/apply-v05-patch.py
          python3 scripts/apply-v05-backup-fix.py
          python3 scripts/apply-v06-draft-patch.py
          python3 scripts/apply-v06-draft-date-fix.py
          python3 scripts/apply-v07-play-policy.py
          python3 scripts/apply-v08-lyon-weather.py
          python3 scripts/apply-v081-lyon-visibility.py
          python3 scripts/apply-v082-remote-sensor-ui.py
          python3 scripts/apply-v083-complete-weather.py
          python3 scripts/apply-v084-integrity-navigation.py
          python3 scripts/apply-v085-preview-doubletap.py
          python3 scripts/apply-v086-lyon-preview.py
          python3 scripts/apply-v087-lyon-continuity.py
          python3 scripts/apply-v090-lyon-lab.py

      - name: Commit generated source patches
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/BackupLayer.kt \
            app/src/main/java/com/fabdata/app/DataLayer.kt \
            app/src/main/java/com/fabdata/app/LyonWeatherSync.kt \
            app/src/main/java/com/fabdata/app/LyonLabLayer.kt \
            app/src/main/java/com/fabdata/app/RemoteSensorLayer.kt
          if git diff --cached --quiet; then
            echo "Source patches already committed"
          else
            git commit -m "Apply FabData v0.9.0 source patches"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
            echo "Google Play upload signing enabled"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
            echo "Google Play secrets are not configured; using development fallback signing"
          fi

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify generated packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage named APK and AAB
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.9.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.9.0-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.9.0-signing-mode.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.9.0-release
          path: |
            artifacts/FabData-v0.9.0-release.apk
            artifacts/FabData-v0.9.0-release.aab
            artifacts/FabData-v0.9.0-signing-mode.txt
          if-no-files-found: error

      - name: Publish APK and AAB on branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.9.0-release.apk artifacts/FabData-v0.9.0-release.aab artifacts/FabData-v0.9.0-signing-mode.txt
          if git diff --cached --quiet; then
            echo "Packages unchanged"
          else
            git commit -m "Build FabData v0.9.0 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release with APK and AAB
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.9.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "FabData v0.9.0" \
              --notes "FabData v0.9.0 — Lyon officiel multi-source : 6 min Météo-France, archive horaire, courbe reconstruite tangentielle, journal AUTO/MANUEL, corrections par double-tap et personnalisation Style A/B + Aura A/B + opacité par courbe. Migration SQLite additive uniquement ; données brutes historiques préservées."
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.9.0-release.apk \
            artifacts/FabData-v0.9.0-release.aab \
            artifacts/FabData-v0.9.0-signing-mode.txt \
            --clobber
