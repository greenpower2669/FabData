name: Android APK + AAB v0.19.5 final

on:
  push:
    branches:
      - 'agent/v0.19.5-bimass-zero-reference'
    paths:
      - '.github/workflows/android-build-v0195-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabdata-v0195-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout compiled v0.19.5 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final v0.19.5 regression and physics guards
        run: |
          need() { grep -Fq "$1" "$2" || { echo "ERROR missing guard: $1 in $2"; exit 1; }; }

          need 'versionCode = 41' app/build.gradle.kts
          need 'versionName = "0.19.5"' app/build.gradle.kts
          need 'thermal-zero-bimass-6' app/src/main/java/com/fabdata/app/PointSourceLayer.kt

          INERTIA=app/src/main/java/com/fabdata/app/ThermalInertiaExperiment.kt
          ENGINE=app/src/main/java/com/fabdata/app/ThermalEngine.kt
          MAIN=app/src/main/java/com/fabdata/app/MainActivity.kt

          need 'val surfaceTaus = doubleArrayOf(18.0, 30.0, 48.0, 72.0)' "$INERTIA"
          need 'val deepTaus = doubleArrayOf(144.0, 240.0, 336.0, 504.0, 720.0)' "$INERTIA"
          need 'val deepShares = doubleArrayOf(0.55, 0.70, 0.82)' "$INERTIA"
          need 'private fun propagateTwoMass' "$INERTIA"
          need 'val surfaceTarget = 0.82 * forcing + 0.18 * deep' "$INERTIA"
          need 'val nextDeep = deep + alphaDeep * (nextSurface - deep)' "$INERTIA"
          need 'temperature = outputMass[index]' "$INERTIA"

          need 'val x = tout - mass' "$ENGINE"
          need 'val y = a.temperature - mass' "$ENGINE"
          need 'private fun fitProjectionFactor' "$ENGINE"
          need 'val target = mass + k * (tout - mass)' "$ENGINE"
          need 'if (coeff.size == 1 || coeff.size >= 6) return learned' "$ENGINE"

          # Le sélecteur et ses aides restent présents ; l'égalité binaire de MainActivity
          # avec v0.19.4 ci-dessous protège également le correctif ANR v0.19.3.
          need 'Sélectionner une période' "$MAIN"
          need '? Aide' "$MAIN"
          need '! Astuce du jour' "$MAIN"

          git fetch origin tag v0.19.4 --force || true
          for f in \
            app/src/main/java/com/fabdata/app/BackupLayer.kt \
            app/src/main/java/com/fabdata/app/DataLayer.kt \
            app/src/main/java/com/fabdata/app/MainActivity.kt \
            app/src/main/java/com/fabdata/app/ThermalTrainingMask.kt \
            app/src/main/java/com/fabdata/app/WeatherReferenceLayer.kt; do
            git diff --quiet v0.19.4 -- "$f" || { echo "ERROR protected file changed: $f"; exit 1; }
          done

          python3 - <<'PY'
          import math
          def projected(tm,tout,k): return tm+k*(tout-tm)
          assert projected(26,26,.2)==26
          assert projected(26,30,.2)>26
          assert projected(26,22,.2)<26
          xs=[0,0,2,-2,4,-4]; ys=[.1,-.1,.4,-.4,.8,-.8]
          k=sum(x*y for x,y in zip(xs,ys))/sum(x*x for x in xs)
          assert math.isfinite(k) and abs(k-.2)<1e-12
          surface=deep=26.0
          a_s=1-math.exp(-1/30.0); a_d=1-math.exp(-1/336.0)
          ns=surface+a_s*((.82*30+.18*deep)-surface)
          nd=deep+a_d*(ns-deep)
          nm=.30*ns+.70*nd
          assert 26<nm<ns<30
          ns2=ns+a_s*((.82*22+.18*nd)-ns)
          assert ns2<ns
          print('final v0.19.5 physics guards OK')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin debug first
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Restore Google Play upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.FABDATA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FABDATA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FABDATA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FABDATA_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fabdata-upload.jks"
            echo "FABDATA_KEYSTORE_PATH=$RUNNER_TEMP/fabdata-upload.jks" >> "$GITHUB_ENV"
            echo "FABDATA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FABDATA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FABDATA_SIGNING_MODE=google-play-upload-key" >> "$GITHUB_ENV"
          else
            echo "FABDATA_SIGNING_MODE=development-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify packages
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Stage final v0.19.5 packages
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FabData-v0.19.5-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FabData-v0.19.5-release.aab
          printf '%s\n' "$FABDATA_SIGNING_MODE" > artifacts/FabData-v0.19.5-signing-mode.txt
          sha256sum artifacts/FabData-v0.19.5-release.apk artifacts/FabData-v0.19.5-release.aab > artifacts/FabData-v0.19.5-sha256.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FabData-v0.19.5-release
          path: |
            artifacts/FabData-v0.19.5-release.apk
            artifacts/FabData-v0.19.5-release.aab
            artifacts/FabData-v0.19.5-signing-mode.txt
            artifacts/FabData-v0.19.5-sha256.txt
          if-no-files-found: error

      - name: Commit final packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+greenpower2669@users.noreply.github.com"
          git add artifacts/FabData-v0.19.5-release.apk artifacts/FabData-v0.19.5-release.aab artifacts/FabData-v0.19.5-signing-mode.txt artifacts/FabData-v0.19.5-sha256.txt
          if git diff --cached --quiet; then
            echo "v0.19.5 packages unchanged"
          else
            git commit -m "Build FabData v0.19.5 APK + AAB"
            git push
          fi

      - name: Publish GitHub Release v0.19.5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.19.5
        run: |
          NOTES='FabData v0.19.5 — double évolution physique. La sonde reconstruite est exprimée autour de l inertie thermique : Tin = Tm + k [Tout(t-Δ)-Tm], avec seulement un facteur d atténuation k et un retard Δ appris globalement sur les mesures réelles, sans division point-à-point au passage de zéro. L inertie est désormais RC bi-masse : une couche superficielle réactive couplée à une masse profonde lente. Le stimulus extérieur modifie immédiatement la tangente superficielle sans saut de température puis se transmet à la masse profonde s il persiste. Les RAW, sélection/exclusion, aides et correctif ANR sont conservés. Le modèle calculé passe à thermal-zero-bimass-6 afin que Rationaliser les courbes détecte les anciennes reconstructions.'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "FabData v0.19.5" --notes "$NOTES"
          fi
          gh release upload "$TAG" \
            artifacts/FabData-v0.19.5-release.apk \
            artifacts/FabData-v0.19.5-release.aab \
            artifacts/FabData-v0.19.5-signing-mode.txt \
            artifacts/FabData-v0.19.5-sha256.txt \
            --clobber
